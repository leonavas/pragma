<title>Produto</title>

<div class="flex flex-col gap-6">
  <a href="/produtos" class="text-sm text-muted hover:text-ink">← Voltar para produtos</a>
  <template :if="data.produto">
    <article class="card flex max-w-xl flex-col gap-3">
      <p class="text-sm text-muted" :text="data.produto.categoria"></p>
      <h1 class="text-3xl font-semibold tracking-tight" :text="data.produto.nome"></h1>
      <p :text="data.produto.descricao"></p>
      <p class="text-sm text-muted">id da rota: <code class="font-mono" :text="params.id"></code></p>
    </article>
  </template>
  <template :else>
    <section class="flex flex-col gap-2">
      <h1 class="text-3xl font-semibold tracking-tight">Produto não encontrado</h1>
      <p class="text-muted">Confira o endereço ou volte para a lista.</p>
    </section>
  </template>
</div>
