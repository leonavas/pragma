name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (without v prefix, defaults to core/cli/Cargo.toml)"
        required: false
        type: string
      release:
        description: "Create or update the GitHub Release v<version> from this run"
        required: false
        default: false
        type: boolean
      publish_npm:
        description: "Publish packages to npm"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  # core/cli/.cargo/config.toml points target-dir at the dev machine's /work.
  CARGO_TARGET_DIR: ${{ github.workspace }}/core/cli/target

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            bin: pragma
            archive: pragma-x86_64-unknown-linux-gnu.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            bin: pragma
            archive: pragma-aarch64-unknown-linux-gnu.tar.gz
          - target: x86_64-apple-darwin
            os: macos-15
            bin: pragma
            archive: pragma-x86_64-apple-darwin.tar.gz
          - target: aarch64-apple-darwin
            os: macos-15
            bin: pragma
            archive: pragma-aarch64-apple-darwin.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: pragma.exe
            archive: pragma-x86_64-pc-windows-msvc.zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/cli -> target

      - name: Build pragma release binary
        run: cargo build --release --locked --manifest-path core/cli/Cargo.toml -p pragma-cli --target ${{ matrix.target }}

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "${{ matrix.archive }}" -C "core/cli/target/${{ matrix.target }}/release" "${{ matrix.bin }}"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "core/cli/target/${{ matrix.target }}/release/${{ matrix.bin }}" -DestinationPath "${{ matrix.archive }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: core/cli/target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum pragma-* > SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-assets/pragma-*
            release-assets/SHA256SUMS.txt

      - name: Read the version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release == true
        uses: actions/checkout@v4
        with:
          path: source
          sparse-checkout: core/cli/Cargo.toml
          sparse-checkout-cone-mode: false

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            version="${INPUT_VERSION:-$(sed -n 's/^version = "\(.*\)"/\1/p' source/core/cli/Cargo.toml | head -n 1)}"
            tag="v${version}"
          fi
          if gh release view "${tag}" > /dev/null 2>&1; then
            gh release upload "${tag}" release-assets/* --clobber
          else
            gh release create "${tag}" release-assets/* --generate-notes --title "${tag}" --target "${GITHUB_SHA}"
          fi

  publish-npm:
    name: Publish npm packages
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_npm == true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: artifacts

      - name: Stage npm packages
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            node npm/scripts/stage.mjs --artifacts artifacts --version "${INPUT_VERSION}"
          else
            node npm/scripts/stage.mjs --artifacts artifacts
          fi

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in cli-linux-x64 cli-linux-arm64 cli-darwin-arm64 cli-darwin-x64 cli-win32-x64; do
            npm publish "npm/platforms/${pkg}" --provenance --access public
          done

      - name: Publish root package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish npm/pragma --provenance --access public
