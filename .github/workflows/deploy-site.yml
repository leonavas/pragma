name: Deploy site

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare Workers
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the Cloudflare secrets
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Set the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/cli -> target

      - name: Build pragma release binary
        run: |
          cargo build --release --locked --manifest-path core/cli/Cargo.toml -p pragma-cli
          echo "$GITHUB_WORKSPACE/core/cli/target/release" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site packages
        working-directory: site
        run: npm ci --ignore-scripts

      - name: Check the site
        working-directory: site
        run: pragma check --strict

      - name: Build the site
        working-directory: site
        run: pragma build

      - name: Deploy
        working-directory: site
        run: npx --yes wrangler@4 deploy --config dist/server/wrangler.jsonc
