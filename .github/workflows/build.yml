name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # core/cli/.cargo/config.toml points target-dir at the dev machine's /work.
  CARGO_TARGET_DIR: ${{ github.workspace }}/core/cli/target

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI (linux x64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The binary embeds core/starter, core/runtime and core/docs (see build.rs),
      # so the key covers them too. On a hit, Rust is not compiled at all.
      - name: Restore cached pragma binary
        id: bin-cache
        uses: actions/cache@v4
        with:
          path: core/cli/target/release/pragma
          key: pragma-bin-linux-x64-${{ hashFiles('core/cli/Cargo.lock', 'core/cli/**/Cargo.toml', 'core/cli/**/*.rs', 'core/cli/crates/*/assets/**', 'core/cli/crates/*/src/**', 'core/starter/**', 'core/runtime/**', 'core/docs/**') }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.bin-cache.outputs.cache-hit != 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.bin-cache.outputs.cache-hit != 'true'
        with:
          shared-key: cli
          workspaces: core/cli -> target

      - name: Build pragma release binary
        if: steps.bin-cache.outputs.cache-hit != 'true'
        run: cargo build --release --locked --manifest-path core/cli/Cargo.toml -p pragma-cli

      - name: Print version
        run: core/cli/target/release/pragma -V

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: pragma-linux-x64
          path: core/cli/target/release/pragma
          if-no-files-found: error
          retention-days: 14

  site:
    name: Site (check, build, deploy)
    needs: cli
    runs-on: ubuntu-24.04
    concurrency:
      group: site-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: pragma-linux-x64
          path: bin

      - name: Put pragma on PATH
        run: |
          chmod +x bin/pragma
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Install site packages
        working-directory: site
        run: npm ci --ignore-scripts

      - name: Check the site
        working-directory: site
        run: pragma check --strict

      - name: Build the site
        working-directory: site
        run: pragma build

      - name: Upload site build
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          if-no-files-found: error
          retention-days: 14

      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config dist/server/wrangler.jsonc
