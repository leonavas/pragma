<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mercadinho</title>
    <script>
      // Aplica o tema salvo antes do primeiro paint (evita piscar no refresh).
      try {
        document.documentElement.dataset.theme = localStorage.getItem('mercadinho:tema') === 'dark' ? 'dark' : 'light';
      } catch {}
    </script>
    <link rel="stylesheet" href="/assets/app.css" />
    <script type="module" src="/assets/app.js"></script>
  </head>
  <body>
    <m-app></m-app>
    <noscript>O Mercadinho precisa de JavaScript.</noscript>
  </body>
</html>
