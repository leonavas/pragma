[package]
name = "pragma-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "pragma_cli"
path = "src/lib.rs"

[[bin]]
name = "pragma"
path = "src/main.rs"

[dependencies]
pragma-diag.workspace = true
pragma-compiler.workspace = true
pragma-css.workspace = true
pragma-jslint.workspace = true
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "fs", "process", "io-util", "signal", "sync", "time"] }
hyper = { version = "1.12", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1.5"
bytes = "1.12"
notify = "8.2"
serde_json = "1.0.154"
flate2 = "1.1"
brotli = "8"

[dev-dependencies]
tempfile = "3.27"
