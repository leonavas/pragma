<title>Produto</title>
<template :if="page.loading"><div class="skeleton h-8"></div></template>
<template :else>
  <article>
    <h1 :text="data.produto.nome">…</h1>
    <p-preco :p="data.produto"></p-preco>
    <a :href="data.produto.url" .hidden="!data.produto.url" href="#">ver</a>
    <span :text="params.id"></span>
    <input :model="$qtd" aria-label="Quantidade">
  </article>
</template>
