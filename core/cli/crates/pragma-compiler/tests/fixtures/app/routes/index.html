<title>Início</title>
<section class="p-4">
  <h1 class="text-2xl font-bold">Produtos</h1>
  <button class="btn" @click="alternar" @open="sobre">Alternar</button>
  <c-card titulo="Destaque" destaque class="mt-4">
    <p>Corpo do card</p>
    <button slot="acoes" class="btn" @click="alternar" :text="$aberto">Alternar</button>
  </c-card>
  <ul :show="$aberto">
    <template :for="item in $itens" :key="item.id">
      <li>
        <span :text="item.nome">nome</span>
        <template :if="item.promo">
          <c-card titulo="Promo"><b>promo</b></c-card>
        </template>
        <template :else><i>normal</i></template>
      </li>
    </template>
    <template :empty><li>Nada</li></template>
  </ul>
</section>
