<title>Home</title>
<section class="p-4">
  <h1 class="text-2xl font-bold">Products</h1>
  <button class="btn" @click="toggle" @open="about">Toggle</button>
  <c-card heading="Featured" featured class="mt-4">
    <p>Card body</p>
    <button slot="aside" class="btn" @click="toggle">{$open}</button>
  </c-card>
  <ul :show="$open">
    <for item in $items key=item.id>
      <li>
        <span>{item.name}</span>
        <if item.promo>
          <c-card heading="Promo"><b>promo</b></c-card>
        </if>
        <else><i>normal</i></else>
      </li>
    </for>
    <empty><li>Nothing</li></empty>
  </ul>
</section>
