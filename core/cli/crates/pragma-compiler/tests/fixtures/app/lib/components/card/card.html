<div class="card p-4" .destaque="$destaque">
  <h2 class="text-lg" :text="$titulo">Título</h2>
  <template :if="$destaque"><span class="badge">★</span></template>
  <template :else><span>-</span></template>
  <slot></slot>
  <footer><button class="btn" @click="comprar">Comprar</button><slot name="acoes"><small>sem ações</small></slot></footer>
</div>
