<div class="card p-4" .featured="$featured">
  <h2 class="text-lg" :text="$heading">Title</h2>
  <if $featured><span class="badge">★</span></if>
  <else><span>-</span></else>
  <slot></slot>
  <footer><button class="btn" @click="buy">Buy</button><slot name="aside"><small>no actions</small></slot></footer>
</div>
