<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post</title>
<meta name="description" content="Test shop">
<link rel="icon" href="/img/icon.svg">
<link rel="stylesheet" href="/assets/app.css">
<script>self.__pragmaDev=true</script>
<link rel="modulepreload" href="/assets/routes/blog/[slug].js">
<link rel="modulepreload" href="/assets/lib/components/counter/counter.js">
<link rel="modulepreload" href="/assets/lib/state/cart.js">
<link rel="modulepreload" href="/assets/core/router.js">
<link rel="modulepreload" href="/assets/core/log.js">
<script type="application/json" id="pragma-route">{"pattern":"/blog/:slug","page":"/assets/routes/blog/[slug].js","components":{"counter":"/assets/lib/components/counter/counter.js"},"stores":{"cart":"/assets/lib/state/cart.js"},"loader":true,"ssr":true}</script>
<script type="module" src="/assets/core/boot.js"></script>
<script type="module" src="/_pragma/dev.js"></script>
</head>
<body>
<header class="flex items-center gap-4 p-4">
  <a href="/">Home</a>
  <button data-c="counter" class="btn" data-on-click="add"><span data-text="{state.count}"></span></button>
  <span data-text="{shared.cart.total}"></span>
</header>
<main data-page>
<article class="p-4">
  <h1 data-text="{data.post.heading}"></h1>
  <ul>
    <template data-for="t in data.post.tags" data-key="t.id" data-tid="tea69c8b"><li data-class-active="t.active" class="tag" data-text="{t.name}"></li></template>
  </ul>
  <p data-show="state.read">read</p>
</article>
</main>
<footer class="text-sm text-neutral-500" data-text="{query.ref}"></footer>
</body>
</html>
