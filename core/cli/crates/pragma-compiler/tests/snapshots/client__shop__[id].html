<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product</title>
<meta name="description" content="Test shop">
<link rel="icon" href="/img/icon.svg">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/css/shop/_id_.css" data-pragma-route-css>
<script>self.__pragmaDev=true</script>
<script>self.__pd=fetch('/_data'+location.pathname+location.search,{headers:{accept:'application/json'}});self.__pd.catch(()=>{})</script>
<link rel="modulepreload" href="/assets/routes/shop/_id_.js">
<link rel="modulepreload" href="/assets/lib/components/counter/counter.js">
<link rel="modulepreload" href="/assets/lib/state/cart.js">
<link rel="modulepreload" href="/assets/core/router.js">
<link rel="modulepreload" href="/assets/core/log.js">
<script type="application/json" id="pragma-route">{"pattern":"/shop/:id","page":"/assets/routes/shop/_id_.js","components":{"counter":"/assets/lib/components/counter/counter.js"},"stores":{"cart":"/assets/lib/state/cart.js"},"loader":true,"ssr":false}</script>
<script type="module" src="/assets/core/boot.js"></script>
<script type="module" src="/_pragma/dev.js"></script>
</head>
<body>
<header class="flex items-center gap-4 p-4">
  <a href="/">Home</a>
  <button data-c="counter" class="btn" data-on-click="add"><span data-text="{state.count}"></span></button>
  <span data-text="{shared.cart.total}"></span>
</header>
<main data-page>
<template data-if="page.loading" data-tid="t26767f2"></template>
<template data-else data-tid="t2b31592"></template>

<template data-tpl="t26767f2"><div class="skeleton h-8"></div></template>
<template data-tpl="t2b31592"><article>
    <h1 data-text="{data.product.name}"></h1>
    <strong data-c="price-cead5e" class="text-primary-600" data-text="{data.product.price}"></strong>
    <a data-attr-href="data.product.url" data-class-hidden="!data.product.url" href="#">view</a>
    <span data-text="Product {params.id}"></span>
    <input data-model="state.qty" aria-label="Quantity">
  </article></template></main>
<footer class="text-sm text-neutral-500" data-text="{query.ref}"></footer>
</body>
</html>
