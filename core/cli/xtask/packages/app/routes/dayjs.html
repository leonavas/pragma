<script>
  import dayjs from 'dayjs'
  import relativeTime from 'dayjs/plugin/relativeTime'

  dayjs.extend(relativeTime)

  const start = dayjs('2024-03-10T12:00:00')
  const shiftedDate = start.add(5, 'day').format('YYYY-MM-DD')
  const relativeDate = start.from(dayjs('2024-03-15T12:00:00'))
</script>

<title>dayjs</title>

<h1>dayjs as CommonJS</h1>
<p>March 10 plus five days: <span id="shifted-date">{$shiftedDate}</span></p>
<p>March 10 seen from March 15: <span id="relative-date">{$relativeDate}</span></p>
