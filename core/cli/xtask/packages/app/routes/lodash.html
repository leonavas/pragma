<script>
  import groupBy from 'lodash/groupBy'

  const fruits = ['apple', 'avocado', 'grape', 'banana']

  const fruitsByInitial = Object.entries(groupBy(fruits, fruit => fruit[0]))
    .map(([initial, inGroup]) => initial + ': ' + inGroup.length)
    .join(', ')
</script>

<title>lodash</title>

<h1>lodash as CommonJS</h1>
<p>Fruits by initial: <span id="fruits-by-initial">{$fruitsByInitial}</span></p>
