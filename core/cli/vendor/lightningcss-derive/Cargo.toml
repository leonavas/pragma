# Vendored from lightningcss-derive 1.0.0-alpha.43 (https://github.com/parcel-bundler/lightningcss)
[package]
authors = ["Devon Govett <devongovett@gmail.com>"]
name = "lightningcss-derive"
description = "Derive macros for lightningcss (vendored for pragma)"
version = "1.0.0-alpha.43"
license = "MPL-2.0"
edition = "2021"
publish = false

[lib]
proc-macro = true

[dependencies]
syn = { version = "1.0", features = ["extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
convert_case = "0.6.0"
