<script>
  export let label = ''
  export let start = 0
  export let step = 1
  export let min = -Infinity
  export let max = Infinity

  let count = start

  const atMin = () => count - step < min
  const atMax = () => count + step > max

  function decrement() {
    count -= step
  }

  function increment() {
    count += step
  }
</script>

<div class="inline-flex items-center gap-2" role="group" :aria-label="$label">
  <span class="text-sm text-muted">{$label}</span>
  <button type="button" class="btn btn-icon" @click="decrement" :disabled="$atMin">
    <span aria-hidden="true">−</span><span class="sr-only">Decrease {$label}</span>
  </button>
  <output class="w-8 text-center font-semibold tabular-nums">{$count}</output>
  <button type="button" class="btn btn-icon" @click="increment" :disabled="$atMax">
    <span aria-hidden="true">+</span><span class="sr-only">Increase {$label}</span>
  </button>
</div>
