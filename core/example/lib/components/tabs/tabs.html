<div class="flex flex-col gap-4">
  <div role="tablist" class="flex gap-1 border-b border-line" :aria-label="$label" @keydown="moveWithArrows">
    <button type="button" role="tab" class="tab" value="a" @click="select" :aria-selected="$selected.a" :tabindex="$tabindex.a" :text="$a"></button>
    <button type="button" role="tab" class="tab" value="b" @click="select" :aria-selected="$selected.b" :tabindex="$tabindex.b" :text="$b"></button>
    <button type="button" role="tab" class="tab" value="c" @click="select" :aria-selected="$selected.c" :tabindex="$tabindex.c" :text="$c"></button>
  </div>
  <div role="tabpanel" :aria-label="$a" :show="$visible.a"><slot name="a"></slot></div>
  <div role="tabpanel" :aria-label="$b" :show="$visible.b"><slot name="b"></slot></div>
  <div role="tabpanel" :aria-label="$c" :show="$visible.c"><slot name="c"></slot></div>
</div>
