<script>
  export let label = ''
  export let first = ''
  export let second = ''
  export let third = ''

  const TABS = ['first', 'second', 'third']
  const ARROW_STEPS = { ArrowRight: 1, ArrowLeft: -1 }

  let current = 'first'

  const perTab = compute => Object.fromEntries(TABS.map(tab => [tab, compute(tab)]))
  const visible = () => perTab(tab => tab === current)
  const selected = () => perTab(tab => String(tab === current))
  const tabindex = () => perTab(tab => (tab === current ? 0 : -1))

  function select(tab) {
    current = tab
  }

  function moveWithArrows(event, tablist) {
    const step = ARROW_STEPS[event.key]
    if (!step) return
    const index = (TABS.indexOf(current) + step + TABS.length) % TABS.length
    current = TABS[index]
    tablist.children[index].focus()
  }
</script>

<div class="flex flex-col gap-4">
  <div role="tablist" class="flex gap-1 border-b border-line" :aria-label="$label" @keydown="moveWithArrows(event, el)">
    <button type="button" role="tab" class="tab" @click="select('first')" :aria-selected="$selected.first" :tabindex="$tabindex.first">{$first}</button>
    <button type="button" role="tab" class="tab" @click="select('second')" :aria-selected="$selected.second" :tabindex="$tabindex.second">{$second}</button>
    <button type="button" role="tab" class="tab" @click="select('third')" :aria-selected="$selected.third" :tabindex="$tabindex.third">{$third}</button>
  </div>
  <div role="tabpanel" :aria-label="$first" :show="$visible.first"><slot name="first"></slot></div>
  <div role="tabpanel" :aria-label="$second" :show="$visible.second"><slot name="second"></slot></div>
  <div role="tabpanel" :aria-label="$third" :show="$visible.third"><slot name="third"></slot></div>
</div>

<style>
  .tab {
    margin-bottom: -1px;
    padding: 0.5rem 1rem;
    border-bottom: 2px solid transparent;
    color: var(--color-muted);
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
  }
  .tab[aria-selected="true"] {
    border-color: var(--color-primary-600);
    color: var(--color-ink);
  }
  .tab:focus-visible {
    outline: 2px solid var(--color-primary-500);
    outline-offset: 2px;
  }
</style>
