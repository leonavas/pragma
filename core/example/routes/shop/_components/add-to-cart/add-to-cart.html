<script>
  import { shared, log } from 'pragma'

  export let product = null

  let quantity = 1

  const soldOut = () => product.stock === 0
  const atMin = () => quantity <= 1
  const atMax = () => quantity >= product.stock

  function decrement() {
    quantity -= 1
  }

  function increment() {
    quantity += 1
  }

  function add() {
    shared.cart.add(product, quantity)
    log.info('product added to cart', { 'product.id': product.id, 'cart.item.quantity': quantity })
    quantity = 1
  }
</script>

<div class="flex items-center justify-between gap-2">
  <div class="inline-flex items-center gap-1" role="group" aria-label="Quantity">
    <button type="button" class="btn btn-icon" @click="decrement" :disabled="$atMin">
      <span aria-hidden="true">−</span><span class="sr-only">Decrease quantity</span>
    </button>
    <output class="w-8 text-center tabular-nums">{$quantity}</output>
    <button type="button" class="btn btn-icon" @click="increment" :disabled="$atMax">
      <span aria-hidden="true">+</span><span class="sr-only">Increase quantity</span>
    </button>
  </div>
  <button type="button" class="btn btn-primary" @click="add" :disabled="$soldOut">Add</button>
</div>
