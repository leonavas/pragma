<head>
  <meta name="description" content="Minimart: a small shop and a task list built with pragma, showing routes, loaders, forms and overlays.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<header class="border-b border-line">
  <nav class="mx-auto flex h-16 max-w-5xl items-center gap-8 px-6" aria-label="Main">
    <a href="/" class="flex items-center gap-2 font-semibold tracking-tight">
      <img src="/favicon.svg" alt="" width="28" height="28">
      Minimart
    </a>
    <ul class="flex flex-1 items-center gap-6 text-sm">
      <li><a href="/" class="nav-link">Dashboard</a></li>
      <li><a href="/tasks" class="nav-link">Tasks</a></li>
      <li><a href="/shop" class="nav-link">Shop</a></li>
    </ul>
    <a href="/shop" class="btn">
      Cart
      <span class="rounded-full bg-primary-600 px-2 text-xs font-semibold text-white tabular-nums">{shared.cart.count}</span>
    </a>
  </nav>
</header>
<main data-page class="mx-auto w-full max-w-5xl px-6 py-10"><slot></slot></main>
<footer class="border-t border-line">
  <p class="mx-auto max-w-5xl px-6 py-8 text-sm text-muted">Minimart, the pragma example app.</p>
</footer>
