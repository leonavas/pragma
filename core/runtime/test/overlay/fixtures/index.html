<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>overlay</title>
  <style>
    *, ::backdrop { margin: 0; padding: 0; box-sizing: border-box; border: 0 solid; }
    html[data-scroll-lock] { overflow: hidden; }
    html[data-scroll-lock=gutter] { scrollbar-gutter: stable; }
    [hidden] { display: none !important; }
    dialog::backdrop { background: rgb(0 0 0 / 0.4); }
    .dialog { width: min(100% - 2rem, 28rem); margin: auto; padding: 1.5rem; }
    .tall { height: 3000px; }
  </style>
  <script type="module">
    import { initOverlays, open, close, confirm, closeAll, handlePopState } from '/core/overlay.js'
    const errors = []
    initOverlays({ log: { error: (msg, attrs) => errors.push([msg, attrs]) } })
    self.navigations = 0
    addEventListener('popstate', e => handlePopState(e) || self.navigations++)
    document.addEventListener('click', async e => {
      if (e.target.id == 'item-js') self.r = await confirm('delete')
    })
    self.t = { open, close, confirm, closeAll, errors }
  </script>
</head>
<body>
  <header>
    <button id="open-about" data-open="about">About</button>
    <button id="open-delete" data-open="delete">Delete</button>
    <div class="inline-flex" data-c="dropdown">
      <button type="button" class="btn" id="open-more" data-open="more" popovertarget="more">
        <span>More</span>
      </button>
      <div popover id="more">
        <a href="#help">Help</a>
        <button id="item-copy" data-close value="copy">Copy</button>
        <button id="item-delete" data-open="delete">Delete…</button>
        <button id="item-js">Delete via confirm()…</button>
      </div>
    </div>
    <button id="outside">Outside</button>
  </header>
  <main data-page class="tall">
    <dialog class="dialog" id="about" aria-label="About the app" data-c="modal">
      <header>
        <h2>About the app</h2>
        <button type="button" id="x-about" data-close aria-label="Close">×</button>
      </header>
      <div>
        <p>Content.</p>
        <button id="open-details" data-open="details">Details</button>
      </div>
      <footer><button id="ok-about" data-close value="ok">Close</button></footer>
    </dialog>

    <dialog class="dialog" id="details" aria-label="Details" data-c="modal">
      <header><h2>Details</h2></header>
      <div><p>Second level.</p></div>
      <footer><button id="ok-details" data-close value="ok">Close</button></footer>
    </dialog>

    <dialog class="dialog" role="alertdialog" id="delete" aria-label="Delete project?" data-c="alert">
      <h2>Delete project?</h2>
      <div><p>This cannot be undone.</p></div>
      <footer>
        <button id="cancel-delete" data-close value="cancel">Cancel</button>
        <button id="confirm-delete" data-close value="ok">Delete</button>
      </footer>
    </dialog>
  </main>
</body>
</html>
