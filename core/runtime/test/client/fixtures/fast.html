<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fast</title>
  <script>self.__pragmaDev=true</script>
  <script type="application/json" id="pragma-route">{"pattern":"/fast","page":"/assets/fast.js","components":{},"stores":{"cart":"/assets/cart.js"},"loader":false,"ssr":false}</script>
  <script type="module" src="/core/boot.js"></script>
</head>
<body>
  <header><span id="qty" data-text="{shared.cart.items.length}"></span></header>
  <main data-page>
    <div id="dot" data-var-x="state.x" data-class-far="state.far" data-attr-aria-valuenow="state.x"></div>
    <p id="label" data-text="{state.label}"></p>
    <template data-if="state.open" data-tid="f1"><p id="open" data-text="x = {state.x}"></p></template>
    <ul id="l"><template data-for="item in state.rows" data-key="item.id" data-tid="f2"><li data-class-done="item.done"><span data-text="{item.name}"></span></li></template></ul>
  </main>
</body>
</html>
