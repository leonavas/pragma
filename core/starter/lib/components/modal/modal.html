<dialog class="dialog" :id="$id" :aria-label="$titulo">
  <header class="mb-4 flex items-start justify-between gap-4">
    <h2 class="text-lg font-semibold" :text="$titulo"></h2>
    <button type="button" class="rounded-lg p-1.5 text-muted transition-colors hover:text-ink" @close aria-label="Fechar">
      <svg class="size-5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>
    </button>
  </header>
  <div class="text-sm text-muted"><slot></slot></div>
  <footer class="mt-6 flex justify-end gap-2"><slot name="acoes"></slot></footer>
</dialog>
