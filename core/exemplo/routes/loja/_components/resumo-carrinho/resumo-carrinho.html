<aside class="card flex flex-col gap-4" aria-labelledby="titulo-carrinho">
  <h2 id="titulo-carrinho" class="text-lg font-semibold">Carrinho</h2>
  <ul class="flex flex-col gap-3">
    <template :for="i in shared.carrinho.itens" :key="i.id">
      <li class="flex flex-col gap-1">
        <div class="flex justify-between gap-2 text-sm">
          <span :text="i.nome"></span>
          <span class="font-medium tabular-nums" :text="i.subtotal"></span>
        </div>
        <div class="flex items-center gap-1">
          <button type="button" class="btn btn-icone" @click="menos"><span aria-hidden="true">−</span><span class="sr-only">Diminuir</span></button>
          <output class="w-8 text-center tabular-nums" :text="i.qtd"></output>
          <button type="button" class="btn btn-icone" @click="mais" :disabled="i.cheio"><span aria-hidden="true">+</span><span class="sr-only">Aumentar</span></button>
          <button type="button" class="ml-auto text-sm text-danger-600 hover:underline" @click="remover">Remover</button>
        </div>
      </li>
    </template>
    <template :empty>
      <li class="text-sm text-muted">Carrinho vazio.</li>
    </template>
  </ul>
  <p class="flex justify-between border-t border-line pt-3 font-semibold">
    <span>Total</span><span class="tabular-nums" :text="shared.carrinho.total"></span>
  </p>
  <button type="button" class="btn" @click="esvaziar" :disabled="shared.carrinho.vazio">Esvaziar</button>
  <c-alert id="esvaziar-carrinho" titulo="Esvaziar o carrinho?">
    <p>Todos os itens serão removidos.</p>
    <button slot="acoes" type="button" class="btn" @close value="cancel" autofocus>Cancelar</button>
    <button slot="acoes" type="button" class="btn btn-danger" @close value="ok">Esvaziar</button>
  </c-alert>
</aside>
