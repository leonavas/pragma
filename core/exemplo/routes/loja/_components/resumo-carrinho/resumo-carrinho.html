<aside class="card flex flex-col gap-4" aria-labelledby="titulo-carrinho">
  <h2 id="titulo-carrinho" class="text-lg font-semibold">Carrinho</h2>
  <ul class="flex flex-col gap-3">
    <template data-for="i in shared.carrinho.itens" data-key="i.id">
      <li class="flex flex-col gap-1">
        <div class="flex justify-between gap-2 text-sm">
          <span data-text="i.nome"></span>
          <span class="font-medium tabular-nums" data-text="i.subtotal"></span>
        </div>
        <div class="flex items-center gap-1">
          <button type="button" class="btn btn-icone" data-on-click="menos"><span aria-hidden="true">−</span><span class="sr-only">Diminuir</span></button>
          <output class="w-8 text-center tabular-nums" data-text="i.qtd"></output>
          <button type="button" class="btn btn-icone" data-on-click="mais" data-attr-disabled="i.cheio"><span aria-hidden="true">+</span><span class="sr-only">Aumentar</span></button>
          <button type="button" class="ml-auto text-sm text-danger-600 hover:underline" data-on-click="remover">Remover</button>
        </div>
      </li>
    </template>
    <template data-empty>
      <li class="text-sm text-muted">Carrinho vazio.</li>
    </template>
  </ul>
  <p class="flex justify-between border-t border-line pt-3 font-semibold">
    <span>Total</span><span class="tabular-nums" data-text="shared.carrinho.total"></span>
  </p>
  <button type="button" class="btn" data-on-click="esvaziar" data-attr-disabled="shared.carrinho.vazio">Esvaziar</button>
  <c-alert id="esvaziar-carrinho" titulo="Esvaziar o carrinho?">
    <p>Todos os itens serão removidos.</p>
    <button slot="acoes" type="button" class="btn" data-close value="cancel" autofocus>Cancelar</button>
    <button slot="acoes" type="button" class="btn btn-danger" data-close value="ok">Esvaziar</button>
  </c-alert>
</aside>
