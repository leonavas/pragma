<div class="flex items-center justify-between gap-2">
  <div class="inline-flex items-center gap-1" role="group" aria-label="Quantidade">
    <button type="button" class="btn btn-icone" @click="menos" :disabled="$semMenos">
      <span aria-hidden="true">−</span><span class="sr-only">Diminuir quantidade</span>
    </button>
    <output class="w-8 text-center tabular-nums" :text="$qtd">1</output>
    <button type="button" class="btn btn-icone" @click="mais" :disabled="$semMais">
      <span aria-hidden="true">+</span><span class="sr-only">Aumentar quantidade</span>
    </button>
  </div>
  <button type="button" class="btn btn-primary" @click="adicionar" :disabled="$esgotado">Adicionar</button>
</div>
