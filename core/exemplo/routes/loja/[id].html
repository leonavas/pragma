<title>Produto · Mercadinho</title>

<div class="flex flex-col gap-6">
  <a href="/loja" class="text-sm text-muted hover:text-ink">← Voltar para a loja</a>
  <template :if="data.produto">
    <article class="card flex max-w-xl flex-col gap-4">
      <p class="text-sm text-muted" :text="data.produto.categoriaNome"></p>
      <h1 class="text-3xl font-semibold tracking-tight" :text="data.produto.nome"></h1>
      <p class="text-2xl font-semibold tabular-nums" :text="data.produto.precoBRL"></p>
      <p class="text-sm text-muted"><span :text="data.produto.estoque"></span> em estoque</p>
      <p-comprar :id="data.produto.id" :nome="data.produto.nome" :preco="data.produto.preco" :estoque="data.produto.estoque"></p-comprar>
      <div class="flex items-center gap-3 border-t border-line pt-4 text-sm">
        <button type="button" class="btn" @click="curtir" :disabled="$enviando">Gostei</button>
        <span><span class="tabular-nums" :text="data.produto.curtidas"></span> curtida(s)</span>
        <span class="text-danger-600" role="status" :text="$erro"></span>
      </div>
    </article>
  </template>
  <template :else>
    <section class="flex flex-col gap-2">
      <h1 class="text-3xl font-semibold tracking-tight">Produto não encontrado</h1>
      <p class="text-muted">Confira o endereço ou volte para a loja.</p>
    </section>
  </template>
</div>
