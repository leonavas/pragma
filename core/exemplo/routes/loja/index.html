<title>Loja · Mercadinho</title>

<div class="grid items-start gap-8 lg:grid-cols-3">
  <section class="flex flex-col gap-6 lg:col-span-2" aria-labelledby="titulo-loja">
    <h1 id="titulo-loja" class="text-3xl font-semibold tracking-tight">Loja</h1>
    <div class="flex flex-wrap items-center justify-between gap-3">
      <c-busca rotulo="Buscar produto" placeholder="Buscar produto…" data-with-valor="state.busca"></c-busca>
      <c-filtros rotulo="Categorias">
        <a href="?categoria=todas" data-attr-aria-current="state.categoria.todas">Todas</a>
        <a href="?categoria=mercearia" data-attr-aria-current="state.categoria.mercearia">Mercearia</a>
        <a href="?categoria=limpeza" data-attr-aria-current="state.categoria.limpeza">Limpeza</a>
        <a href="?categoria=hortifruti" data-attr-aria-current="state.categoria.hortifruti">Hortifruti</a>
      </c-filtros>
    </div>

    <template data-if="page.loading">
      <ul class="grid gap-4 sm:grid-cols-2" aria-busy="true" aria-label="Carregando produtos">
        <li class="skeleton h-48 rounded-2xl"></li>
        <li class="skeleton h-48 rounded-2xl"></li>
        <li class="skeleton h-48 rounded-2xl"></li>
        <li class="skeleton h-48 rounded-2xl"></li>
      </ul>
    </template>
    <template data-else>
      <div>
        <template data-if="page.error">
          <div class="card flex flex-col items-start gap-3" role="alert">
            <p class="text-danger-600" data-text="page.error.message"></p>
            <a href="/loja" class="btn">Tentar de novo</a>
          </div>
        </template>
        <template data-else>
          <ul class="grid gap-4 sm:grid-cols-2">
            <template data-for="p in state.produtos" data-key="p.id">
              <li><c-produto-card data-with-produto="p"></c-produto-card></li>
            </template>
            <template data-empty>
              <li class="card text-center text-muted sm:col-span-2">Nenhum produto</li>
            </template>
          </ul>
        </template>
      </div>
    </template>
  </section>

  <c-resumo-carrinho></c-resumo-carrinho>
</div>
