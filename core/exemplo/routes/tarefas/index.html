<title>Tarefas · Mercadinho</title>

<div class="flex flex-col gap-6">
  <header class="flex flex-wrap items-center justify-between gap-4">
    <h1 class="text-3xl font-semibold tracking-tight">Tarefas</h1>
    <c-dropdown id="acoes-tarefas" rotulo="Ações">
      <button type="button" @close @click="concluirTodas">Concluir todas</button>
      <hr>
      <button type="button" class="text-danger-600" @click="limpar">Limpar concluídas…</button>
    </c-dropdown>
  </header>

  <section class="grid gap-4 sm:grid-cols-3" aria-labelledby="resumo-tarefas">
    <h2 id="resumo-tarefas" class="sr-only">Resumo</h2>
    <c-indicador titulo="Concluídas" :valor="shared.tarefas.resumo" :tom="$tom"></c-indicador>
  </section>

  <form class="flex flex-col gap-1" novalidate @submit="adicionar">
    <div class="flex gap-2">
      <input id="nova-tarefa" name="titulo" class="campo flex-1" placeholder="Nova tarefa" autocomplete="off" aria-label="Nova tarefa" aria-describedby="erro-tarefa" :model="$nova" :aria-invalid="$invalida">
      <button class="btn btn-primary">Adicionar</button>
    </div>
    <p id="erro-tarefa" class="min-h-5 text-sm text-danger-600" :text="$erro"></p>
  </form>

  <div class="flex flex-wrap items-center justify-between gap-3">
    <c-busca rotulo="Buscar tarefa" placeholder="Buscar tarefa…" :valor="$busca"></c-busca>
    <c-filtros rotulo="Filtrar tarefas">
      <a href="?filtro=todas" :aria-current="$filtro.todas">Todas</a>
      <a href="?filtro=pendentes" :aria-current="$filtro.pendentes">Pendentes</a>
      <a href="?filtro=concluidas" :aria-current="$filtro.concluidas">Concluídas</a>
    </c-filtros>
  </div>

  <ul class="card divide-y divide-line p-0">
    <template :for="t in $visiveis" :key="t.id">
      <li class="flex items-center gap-3 px-4 py-2">
        <input type="checkbox" class="size-4" :checked="t.feita" :aria-label="t.titulo" @change="alternar">
        <template :if="t.editando">
          <input class="campo flex-1" aria-label="Editar tarefa" autofocus :model="$rascunho" @keydown="teclaEdicao" @focusout="salvarEdicao">
        </template>
        <template :else>
          <span class="flex-1 py-2" title="Duplo clique para editar" .line-through="t.feita" .text-muted="t.feita" :text="t.titulo" @dblclick="editar"></span>
        </template>
        <button type="button" class="btn btn-icone" :aria-label="t.rotuloRemover" @click="remover">×</button>
      </li>
    </template>
    <template :empty>
      <li class="px-4 py-8 text-center text-muted">Nenhuma tarefa</li>
    </template>
  </ul>
</div>

<c-alert id="limpar-concluidas" titulo="Limpar concluídas?">
  <p>As tarefas concluídas serão removidas.</p>
  <button slot="acoes" type="button" class="btn" @close value="cancel" autofocus>Cancelar</button>
  <button slot="acoes" type="button" class="btn btn-danger" @close value="ok">Limpar</button>
</c-alert>
