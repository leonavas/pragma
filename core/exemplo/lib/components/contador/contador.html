<div class="inline-flex items-center gap-2" role="group" data-attr-aria-label="props.rotulo">
  <span class="text-sm text-muted" data-text="props.rotulo"></span>
  <button type="button" class="btn btn-icone" data-on-click="menos" data-attr-disabled="state.semMenos">
    <span aria-hidden="true">−</span><span class="sr-only">Diminuir <span data-text="props.rotulo"></span></span>
  </button>
  <output class="w-8 text-center font-semibold tabular-nums" data-text="state.n"></output>
  <button type="button" class="btn btn-icone" data-on-click="mais" data-attr-disabled="state.semMais">
    <span aria-hidden="true">+</span><span class="sr-only">Aumentar <span data-text="props.rotulo"></span></span>
  </button>
</div>
