<div class="flex flex-col gap-4">
  <div role="tablist" class="flex gap-1 border-b border-line" :aria-label="$rotulo" @keydown="tecla">
    <button type="button" role="tab" class="aba" value="a" @click="selecionar" :aria-selected="$selecionada.a" :tabindex="$tabindex.a" :text="$a"></button>
    <button type="button" role="tab" class="aba" value="b" @click="selecionar" :aria-selected="$selecionada.b" :tabindex="$tabindex.b" :text="$b"></button>
    <button type="button" role="tab" class="aba" value="c" @click="selecionar" :aria-selected="$selecionada.c" :tabindex="$tabindex.c" :text="$c"></button>
  </div>
  <div role="tabpanel" :aria-label="$a" :show="$ativa.a"><slot name="a"></slot></div>
  <div role="tabpanel" :aria-label="$b" :show="$ativa.b"><slot name="b"></slot></div>
  <div role="tabpanel" :aria-label="$c" :show="$ativa.c"><slot name="c"></slot></div>
</div>
