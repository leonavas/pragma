<div class="wrap">
  <div class="doc-switcher sticky top-14 z-30 mb-10 flex h-12 items-center gap-2 border-b border-line bg-ground font-mono text-xs lg:hidden">
    <a href="/examples" class="flex h-full items-center text-muted no-underline hover:text-ink">Examples</a>
    <span class="text-faint" aria-hidden="true">/</span>
    <c-dropdown id="doc-sections" :label="$heading">
      <c-section-nav class="compact" label="Example sections"></c-section-nav>
    </c-dropdown>
  </div>
  <aside class="hidden self-start lg:sticky lg:top-24 lg:block">
    <a href="/examples" class="label nav-link">All examples</a>
    <c-section-nav class="compact mt-4" label="Example sections"></c-section-nav>
  </aside>
  <article class="min-w-0">
    <header class="border-b border-line pb-10">
      <h1 class="doc-title">{$heading}</h1>
      <p class="mt-5 max-w-2xl text-lg leading-relaxed text-muted">{$lede}</p>
    </header>
    <slot></slot>
    <c-section-nav class="pager mt-12" label="Previous and next section"></c-section-nav>
  </article>
</div>

<style>
  [data-c="doc"] .doc-switcher { margin-inline: calc(var(--gutter) * -1); padding-inline: var(--gutter); }
  [data-c="doc"] .doc-switcher .btn { height: 2.25rem; margin-left: -0.5rem; padding: 0 0.5rem; gap: 0.375rem; border-color: transparent; color: var(--color-accent); font-size: 0.75rem; }
  [data-c="doc"] .doc-switcher [popover] { width: min(18rem, calc(100vw - 2 * var(--gutter))); max-height: min(70vh, 26rem); padding: 0.5rem 0.875rem; overflow-y: auto; }
  [data-c="doc"] .doc-title { font-size: clamp(2.25rem, 5vw, 3.5rem); font-weight: 500; line-height: 1.02; letter-spacing: -0.035em; }
  @media (min-width: 64rem) {
    [data-c="doc"] { display: grid; grid-template-columns: 13rem minmax(0, 1fr); gap: 4rem; padding-top: 4rem; }
  }
</style>
