<script>
  export let file = null
  export let files = []

  const expanded = () => (file.expanded ? 'true' : 'false')

  function toggle() {
    const next = !file.expanded
    for (const candidate of files) candidate.expanded = next
  }
</script>

<button type="button" class="showcase-expand h-11 w-full cursor-pointer items-center justify-center border-t border-line font-mono text-xs text-muted hover:text-ink" :aria-expanded="$expanded" :aria-controls="$file.id" @click="toggle"><slot></slot></button>
