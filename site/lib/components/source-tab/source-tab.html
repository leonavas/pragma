<script>
  export let file = null
  export let files = []

  const pressed = () => (file.active ? 'true' : 'false')

  function select() {
    for (const candidate of files) candidate.active = candidate === file
  }
</script>

<button type="button" class="showcase-tab relative flex-none cursor-pointer border-r border-b border-line px-3.5 py-3 font-mono text-xs transition-colors hover:text-ink" :aria-pressed="$pressed" :aria-controls="$file.id" @click="select"><slot></slot></button>
