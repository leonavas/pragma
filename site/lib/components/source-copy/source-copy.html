<script>
  import { log } from 'pragma'

  export let file = null

  const resetDelayMs = 1800

  let status = 'idle'
  let resetTimer = 0

  const copied = () => status === 'copied'
  const blocked = () => status === 'blocked'

  function announcement() {
    if (status === 'copied') return `Copied ${file.name}, ${file.lines.length} lines.`
    if (status === 'blocked') return `The clipboard is blocked. The code of ${file.name} is selected: copy it with the keyboard.`
    return ''
  }

  async function copy() {
    clearTimeout(resetTimer)
    try {
      await navigator.clipboard.writeText(file.lines.map(line => line.text).join('\n'))
      status = 'copied'
    } catch (failure) {
      log.warn('source copy failed', { 'file.path': file.path, 'exception.message': failure.message })
      getSelection()?.selectAllChildren(document.getElementById(file.id))
      status = 'blocked'
    }
    resetTimer = setTimeout(() => { status = 'idle' }, resetDelayMs)
  }

  function mount() {
    return () => clearTimeout(resetTimer)
  }
</script>

<div class="flex flex-none items-center">
  <button type="button" class="showcase-copy inline-flex min-h-9 cursor-pointer items-center gap-2 px-2.5 font-mono text-xs" .is-done="$copied" .is-blocked="$blocked" @click="copy">
    <svg class="showcase-copy-icon size-3.5" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" fill="none" stroke="currentColor"></rect><path d="M10.5 3.5v-1h-8v8h1" fill="none" stroke="currentColor"></path></svg>
    <svg class="showcase-check-icon size-3.5" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"></path></svg>
    <span class="showcase-copy-idle">Copy <span class="sr-only">{$file.name}</span></span>
    <span class="showcase-copy-done">Copied {$file.lines.length} lines</span>
    <span class="showcase-copy-blocked">Code selected</span>
  </button>
  <p class="sr-only" role="status">{$announcement}</p>
</div>
