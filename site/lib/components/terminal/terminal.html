<script>
  import { log } from 'pragma'

  export let title = ''
  export let copy = ''

  const resetDelayMs = 1800
  const labels = { idle: 'Copy', copied: 'Copied', failed: 'Copy failed' }
  const announcements = {
    idle: '',
    copied: 'Commands copied to the clipboard.',
    failed: 'Copy failed. Select the commands and copy them by hand.',
  }

  let copyStatus = 'idle'
  let resetTimer = 0

  const copied = () => copyStatus === 'copied'
  const copyText = () => labels[copyStatus]
  const copyLabel = () => (copyStatus === 'idle' ? 'Copy the commands' : labels[copyStatus])
  const announcement = () => announcements[copyStatus]

  async function copyCommands() {
    clearTimeout(resetTimer)
    try {
      await navigator.clipboard.writeText(copy)
      copyStatus = 'copied'
    } catch (failure) {
      log.warn('command copy failed', { 'exception.message': failure.message })
      copyStatus = 'failed'
    }
    resetTimer = setTimeout(() => { copyStatus = 'idle' }, resetDelayMs)
  }

  function mount() {
    return () => clearTimeout(resetTimer)
  }
</script>

<figure>
  <figcaption class="term-bar min-h-10">
    <span class="term-dot" aria-hidden="true"></span>
    <span class="min-w-0 flex-1 truncate">{$title}</span>
    <if $copy>
      <button type="button" class="term-copy inline-flex shrink-0 cursor-pointer items-center gap-2 font-mono text-xs hover:text-ink" @click="copyCommands" .text-accent-text="$copied" :aria-label="$copyLabel">
        <if $copied>
          <svg class="term-check size-3.5" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"></path></svg>
        </if>
        <else>
          <svg class="size-3.5" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" fill="none" stroke="currentColor"></rect><path d="M10.5 3.5v-1h-8v8h1" fill="none" stroke="currentColor"></path></svg>
        </else>
        <span>{$copyText}</span>
      </button>
    </if>
  </figcaption>
  <slot></slot>
  <p class="sr-only" role="status">{$announcement}</p>
</figure>
