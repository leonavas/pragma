<div class="flex w-full min-w-0 flex-col border border-line bg-ground">
  <div class="flex h-11 items-center gap-1 border-b border-line bg-sunken pr-1 font-mono text-xs">
    <button type="button" class="frame-control inline-flex h-11 min-w-11 flex-none cursor-pointer items-center justify-center text-muted transition-colors hover:text-ink" @click="reload" :aria-label="$reloadLabel" .is-busy="$loading">
      <svg class="frame-reload size-3.5" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8A5.5 5.5 0 1 1 11.9 4.1" fill="none" stroke="currentColor" stroke-width="1.25"></path><path d="M12.4 1.6v2.9H9.5" fill="none" stroke="currentColor" stroke-width="1.25"></path></svg>
    </button>
    <p class="frame-address h-8 min-w-0 flex-1 truncate border border-line bg-ground px-3 text-left text-ink">
      <span class="frame-path" :show="!$live" :text="$src"></span>
      <span class="frame-path" hidden :show="$live" :data-beat="$beat" :text="$current"></span>
    </p>
    <p class="hidden flex-none whitespace-nowrap pl-2 pr-1 tabular-nums text-faint sm:block" :show="$timing" :data-kind="$navigation"><span class="frame-kind" :text="$navigation"></span><span class="px-1.5 text-line-strong" aria-hidden="true">·</span><span class="text-muted" :text="$timing"></span></p>
    <a class="frame-control inline-flex h-11 min-w-11 flex-none items-center justify-center gap-2 text-muted no-underline transition-colors hover:text-ink sm:px-3" :href="$current" target="_blank" rel="noopener" :aria-label="$openLabel">
      <span class="hidden sm:inline">Open</span>
      <svg class="size-3.5" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 2.5h4v4M13.5 2.5l-6 6M11.5 9.5v4h-9v-9h4" fill="none" stroke="currentColor" stroke-width="1.25"></path></svg>
    </a>
  </div>
  <iframe class="frame-view block w-full border-0 bg-ground" :src="$src" :title="$title" loading="lazy"></iframe>
</div>
