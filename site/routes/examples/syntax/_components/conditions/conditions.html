<script>
  const sampleOrders = [
    { id: '#1042', total: '$18.00' },
    { id: '#1043', total: '$64.50' },
  ]

  let mode = 'ready'

  const modes = () => ['loading', 'error', 'empty', 'ready'].map(id => ({ id, pressed: id === mode ? 'true' : 'false' }))
  const loading = () => mode === 'loading'
  const failed = () => mode === 'error'
  const orders = () => (mode === 'ready' ? sampleOrders : [])
  const noOrders = () => orders().length === 0

  function pick(id) {
    mode = id
  }
</script>

<div>
  <div class="conditions-modes" role="group" aria-label="Simulated state">
    <for option in $modes key=option.id>
      <button type="button" class="conditions-mode" :aria-pressed="option.pressed" @click="pick(option.id)">{option.id}</button>
    </for>
  </div>
  <if $loading>
    <div class="conditions-panel" aria-busy="true">
      <span class="skeleton conditions-bar"></span>
      <span class="skeleton conditions-bar conditions-short"></span>
    </div>
  </if>
  <else-if $failed>
    <p class="conditions-panel conditions-error" role="alert">Could not load the orders. Retry in a moment.</p>
  </else-if>
  <else-if $noOrders>
    <p class="conditions-panel conditions-muted">No orders yet.</p>
  </else-if>
  <else>
    <ul class="conditions-panel">
      <for order in $orders key=order.id>
        <li class="conditions-order"><span>{order.id}</span><span>{order.total}</span></li>
      </for>
    </ul>
  </else>
</div>

  [data-c="conditions"] {
    display: grid;
    gap: 1rem;
    width: 100%;
    max-width: 20rem;
  }
  .conditions-modes {
    display: flex;
    border: 1px solid var(--color-line-strong);
  }
  .conditions-mode {
    flex: 1;
    padding: 0.5rem 0.25rem;

    font-family: var(--font-mono);
    font-size: 0.75rem;
    cursor: pointer;
  }
  .conditions-mode + .conditions-mode { border-left: 1px solid var(--color-line-strong); }
  .conditions-mode:hover { color: var(--color-ink); }
  .conditions-mode[aria-pressed="true"] {
    background: var(--color-accent);
    color: var(--color-accent-ink);
  }
  .conditions-panel {
    display: grid;
    align-content: center;
    gap: 0.5rem;
    min-height: 5.5rem;
    padding: 0.875rem 1rem;
    border: 1px solid var(--color-line);
    background: var(--color-surface);
    font-size: 0.875rem;
  }
  .conditions-bar { height: 0.75rem; }
  .conditions-short { width: 60%; }
  .conditions-error { color: var(--color-error); }
  .conditions-muted { color: var(--color-faint); }
  .conditions-order {
    display: flex;
    justify-content: space-between;

  }
</style>
