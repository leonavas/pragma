<div>
  <button type="button" class="btn" @open="syntax-shortcut">Open dialog</button>
  <c-modal id="syntax-shortcut" title="Opened by @open">
    <p class="text-muted">No action ran: the button named this overlay by id. Esc, the backdrop and Back close it too.</p>
    <button slot="actions" type="button" class="btn btn-primary" @close value="ok">Close with @close</button>
  </c-modal>
</div>
