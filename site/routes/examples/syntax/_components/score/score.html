<script>
  let score = 0

  function hit(points) {
    score += points
  }
</script>

<div class="grid justify-items-center gap-3">
  <p class="font-mono text-3xl font-bold tabular-nums">{$score} pts</p>
  <div class="flex gap-2">
    <button class="btn" @click="hit(100)">Bumper +100</button>
    <button class="btn btn-primary" @click="hit(500)">Ramp +500</button>
  </div>
</div>
