<script>
  let mood = 'purring'

  const purring = () => mood === 'purring'
  const hungry = () => mood === 'hungry'
</script>

<div class="grid w-full max-w-xs gap-3">
  <select class="rounded-lg border border-line bg-surface px-3 py-2 text-sm"
    aria-label="Cat mood" :model="$mood">
    <option value="purring">Purring</option>
    <option value="hungry">Hungry</option>
    <option value="zoomies">Zoomies</option>
  </select>
  <if $purring>
    <p class="rounded-lg border border-line bg-surface p-3 text-sm">
      Content. You may live.
    </p>
  </if>
  <else-if $hungry>
    <p class="rounded-lg border border-line bg-surface p-3 text-sm">
      Bowl is 98% full. Literally starving.
    </p>
  </else-if>
  <else>
    <p class="rounded-lg border border-line bg-surface p-3 text-sm">
      3 AM sprint across the couch.
    </p>
  </else>
</div>
