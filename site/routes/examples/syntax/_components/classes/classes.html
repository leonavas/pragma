<script>
  let done = false

  const pressed = () => (done ? 'true' : 'false')
  const buttonLabel = () => (done ? 'Reopen' : 'Mark as done')

  function toggle() {
    done = !done
  }
</script>

<div>
  <p class="classes-task" .line-through="$done" .text-faint="$done" .is-pending="!$done" .md:font-semibold="$done">Ship the release notes</p>
  <button type="button" class="btn btn-small" :aria-pressed="$pressed" @click="toggle">{$buttonLabel}</button>
</div>

<style>
  [data-c="classes"] {
    display: grid;
    justify-items: start;
    gap: 1rem;
  }
  .classes-task {
    padding: 0.75rem 1rem;
    border: 1px solid var(--color-line);
    background: var(--color-surface);
    transition: color 0.18s var(--ease-out), border-color 0.18s var(--ease-out);
  }
  .classes-task.is-pending { border-color: var(--color-accent); }
  @media (prefers-reduced-motion: reduce) {
    .classes-task { transition: none; }
  }
</style>
