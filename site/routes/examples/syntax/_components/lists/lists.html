<script>
  const startingGroups = () => [
    { id: 'today', name: 'Today', items: [{ id: 'a', label: 'Review the PR', done: false }, { id: 'b', label: 'Write the changelog', done: false }] },
    { id: 'later', name: 'Later', items: [{ id: 'c', label: 'Upgrade the runtime', done: false }] },
  ]

  let groups = startingGroups()

  function toggle(item) {
    item.done = !item.done
  }

  function clear(group) {
    group.items = []
  }

  function reset() {
    groups = startingGroups()
  }
</script>

<div>
  <for group in $groups key=group.id>
    <section class="lists-group" aria-label="{group.name}">
      <div class="lists-head">
        <h3 class="label">{group.name}</h3>
        <button type="button" class="lists-clear" :show="group.items.length" @click="clear(group)">Clear</button>
      </div>
      <ul class="lists-items">
        <for item in group.items key=item.id>
          <li>
            <label class="lists-item" .line-through="item.done" .text-faint="item.done"><input type="checkbox" :checked="item.done" @change="toggle(item)"> {item.label}</label>
          </li>
        </for>
        <empty>
          <li class="lists-empty">Empty group</li>
        </empty>
      </ul>
    </section>
  </for>
  <button type="button" class="btn btn-small" @click="reset">Reset lists</button>
</div>
