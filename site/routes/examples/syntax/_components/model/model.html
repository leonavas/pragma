<script>
  let name = 'Ada'
  let quantity = 2
  let shipping = 'standard'
  let size = 'm'
  let gift = false
  let note = ''

  function readout() {
    return Object.entries({ name, quantity, shipping, size, gift, note }).map(([key, value]) => ({
      key,
      shown: JSON.stringify(value),
      kind: value === null ? 'null' : typeof value,
    }))
  }
</script>

<form aria-label="Order options" notool>
  <label class="model-field">
    <span class="label">text</span>
    <input class="model-input" :model="$name">
  </label>
  <label class="model-field">
    <span class="label">number</span>
    <input class="model-input" type="number" min="0" max="9" :model="$quantity">
  </label>
  <label class="model-field">
    <span class="label">range</span>
    <input class="model-range" type="range" min="0" max="9" :model="$quantity">
  </label>
  <label class="model-field">
    <span class="label">select</span>
    <select class="model-input" :model="$shipping">
      <option value="standard">Standard</option>
      <option value="express">Express</option>
    </select>
  </label>
  <fieldset class="model-field">
    <legend class="label">radio</legend>
    <div class="model-row">
      <label><input type="radio" name="model-size" value="s" :model="$size"> S</label>
      <label><input type="radio" name="model-size" value="m" :model="$size"> M</label>
      <label><input type="radio" name="model-size" value="l" :model="$size"> L</label>
    </div>
  </fieldset>
  <label class="model-row">
    <input type="checkbox" :model="$gift">
    <span>checkbox: gift wrap</span>
  </label>
  <label class="model-field">
    <span class="label">textarea</span>
    <textarea class="model-input" rows="2" :model="$note"></textarea>
  </label>
  <output class="model-readout">
    <for field in $readout key=field.key>
      <span class="model-line"><span class="model-key">{field.key}</span><span>{field.shown}</span><span class="model-type">{field.kind}</span></span>
    </for>
  </output>
</form>

<style>
  [data-c="model"] {
    display: grid;
    gap: 0.875rem;
    width: 100%;
    max-width: 20rem;
    font-size: 0.875rem;
  }
  .model-field {
    display: grid;
    gap: 0.375rem;
  }
  .model-row {
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .model-row label {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
  }
  .model-input {
    width: 100%;
    padding: 0.375rem 0.5rem;
    border: 1px solid var(--color-line-strong);
    background: var(--color-sunken);
    color: var(--color-ink);
  }
  :is(.model-range, input[type="radio"], input[type="checkbox"]) { accent-color: var(--color-accent); }
  .model-readout {
    display: grid;
    gap: 0.25rem;
    padding: 0.75rem;
    border: 1px solid var(--color-line);
    background: var(--color-sunken);
    font-family: var(--font-mono);
    font-size: 0.75rem;
  }
  .model-line {
    display: grid;
    grid-template-columns: 5rem minmax(0, 1fr) auto;
    gap: 0.5rem;
  }
  .model-line > * {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .model-key { color: var(--color-faint); }
  .model-type { color: var(--color-accent); }
</style>
