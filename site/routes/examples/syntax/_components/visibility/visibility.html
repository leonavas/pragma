<script>
  let open = false

  const expanded = () => (open ? 'true' : 'false')
  const buttonLabel = () => (open ? 'Hide both' : 'Show both')

  function toggle() {
    open = !open
  }
</script>

<div>
  <button type="button" class="btn btn-small" :aria-expanded="$expanded" aria-controls="visibility-note" @click="toggle">{$buttonLabel}</button>
  <div class="visibility-panes">
    <div class="visibility-pane">
      <p class="label">:show</p>
      <p id="visibility-note" class="visibility-box" :show="$open">Toggled by the hidden attribute; this node never leaves the DOM.</p>
      <p class="visibility-empty" :show="!$open">nothing visible</p>
    </div>
    <div class="visibility-pane">
      <p class="label">&lt;if&gt; + autofocus</p>
      <if $open>
        <label class="visibility-box">
          <span>Created on open, focused:</span>
          <input class="visibility-input" autofocus placeholder="Type here">
        </label>
      </if>
      <else>
        <p class="visibility-empty">not in the DOM</p>
      </else>
    </div>
  </div>
</div>
