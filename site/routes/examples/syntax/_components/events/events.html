<script>
  const maxEntries = 5

  let draft = ''
  let counter = 0
  let entries = []

  function record(name, detail) {
    counter += 1
    entries = [{ id: counter, name, detail }, ...entries].slice(0, maxEntries)
  }

  function typed() {
    record('@input', draft.length + ' chars')
  }

  function pressed(event) {
    if (event.key !== 'Escape') return
    draft = ''
    record('@keydown', 'Escape cleared the field')
  }

  function doubled(el, event) {
    record('@dblclick', 'el <' + el.localName + '>, target <' + event.target.localName + '>')
  }

  function save() {
    record('@submit', 'saved "' + draft + '", no reload')
    draft = ''
  }
</script>

<div>
  <form class="events-form" @submit="save">
    <input class="events-input" aria-label="Task title" placeholder="Type, press Esc or Enter" :model="$draft" @input="typed" @keydown="pressed" @focusout="record('@focusout', 'field lost focus')">
    <button class="btn btn-small">Save</button>
  </form>
  <p class="events-target" @dblclick="doubled(el, event)">Double-click this line or <strong>this word</strong></p>
  <ol class="events-log" aria-label="Event log" aria-live="polite">
    <for entry in $entries key=entry.id>
      <li class="events-entry"><span class="events-name">{entry.name}</span><span>{entry.detail}</span></li>
    </for>
    <empty>
      <li class="events-entry events-idle">No events yet</li>
    </empty>
  </ol>
</div>
