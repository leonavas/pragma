<script>
  let online = false

  const offline = () => !online
  const pressed = () => (online ? 'true' : 'false')
  const tone = () => (online ? 'ok' : 'down')
  const heading = () => (online ? 'Operational' : 'Down')
  const link = () => online && '#bindings'
  const linkTitle = () => online && 'Jump to this example'
  const linkLabel = () => (online ? 'Open status page' : 'No status page while down')

  function toggle() {
    online = !online
  }
</script>

<div>
  <button type="button" class="bindings-switch" :aria-pressed="$pressed" @click="toggle">
    <span class="bindings-knob" aria-hidden="true"></span>
    <span>Service online</span>
  </button>
  <article class="bindings-card" :data-tone="$tone" aria-live="polite">
    <p class="bindings-status">{$heading}</p>
    <a class="bindings-link" :href="$link" :title="$linkTitle">{$linkLabel}</a>
  </article>
  <button type="button" class="btn btn-small" :disabled="$offline">Deploy</button>
</div>
