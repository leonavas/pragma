<script>
  let name = 'Ada'
  let items = []
  let tone = 'ok'
  let open = false
  const total = () => items.length
  function add(amount) {
    items.push(amount)
  }
</script>

<title>Wrong</title>
<h1 :text="$name">x</h1>
<p>{$items.length > 0}</p>
<p>{$name.toUpperCase()}</p>
<p data-text="$name">x</p>
<p style="color: red">x</p>
<button onclick="add()">Add</button>
<p :class="$tone">x</p>
<p>{{ $name }}</p>
<p>Total: ${$total}</p>
<button @click="add($total + 1)">Add</button>
<if test="$open"><p>x</p></if>
<for item in $items><p>{item}</p></for>
<p v-if="$open">x</p>
