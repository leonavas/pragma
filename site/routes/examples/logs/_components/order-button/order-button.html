<script>
  import { log } from 'pragma'

  let cups = 0

  function pourCoffee() {
    cups += 1
    log.info('coffee poured', {
      'coffee.cups': cups,
    })
  }
</script>

<div class="flex flex-wrap items-center gap-3">
  <button class="btn btn-primary" @click="pourCoffee">Pour coffee</button>
  <p class="font-mono text-sm text-muted">Cups logged: {$cups}</p>
</div>
