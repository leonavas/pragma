<script>
  import { log } from 'pragma'
  import { flush } from '../../../../../core/log.js'

  const severityNumbers = { debug: 5, info: 9, warn: 13, error: 17 }

  let records = []
  let orderNumber = 1041
  let nextRecordId = 1

  const orderId = () => 'A-' + orderNumber
  const recordRows = () => records.map(entry => ({
    ...entry,
    levelText: entry.level.toUpperCase() + ' ' + severityNumbers[entry.level],
    isWarn: entry.level === 'warn',
    isError: entry.level === 'error',
    attributesText: JSON.stringify(entry.attributes),
  }))

  function record(level, body, attributes) {
    log[level](body, attributes)
    records = [{ id: nextRecordId, level, body, attributes }, ...records].slice(0, 4)
    nextRecordId += 1
  }

  function placeOrder() {
    orderNumber += 1
    record('info', 'order placed', { 'order.id': orderId(), 'order.items': 3 })
  }

  function retryPayment() {
    record('warn', 'payment retried', { 'order.id': orderId(), 'payment.attempt': 2 })
  }

  function failPayment() {
    try {
      throw new Error('card declined')
    } catch (failure) {
      record('error', 'payment failed', { 'order.id': orderId(), 'exception.message': failure.message })
    }
  }

  function sendNow() {
    flush()
  }

  function mount() {
    log.debug('order panel mounted')
  }
</script>

<div>
  <div class="order-log-actions" role="group" aria-label="Order events">
    <button type="button" class="btn btn-small" @click="placeOrder">Place order</button>
    <button type="button" class="btn btn-small" @click="retryPayment">Retry payment</button>
    <button type="button" class="btn btn-small" @click="failPayment">Fail payment</button>
  </div>
  <ol class="order-log-records" aria-label="Last records passed to log">
    <for record in $recordRows key=record.id>
      <li class="order-log-record" .is-warn="record.isWarn" .is-error="record.isError">
        <span class="order-log-level">{record.levelText}</span>
        <span class="order-log-body">{record.body}</span>
        <span class="order-log-attributes">{record.attributesText}</span>
      </li>
    </for>
    <empty>
      <li class="order-log-empty">No records yet. Click a button.</li>
    </empty>
  </ol>
  <div class="order-log-footer">
    <p class="order-log-note">Queued, then posted to /_otel every 2 s or at 50 records, and with sendBeacon when the tab hides.</p>
    <button type="button" class="btn btn-small" @click="sendNow">Send now</button>
  </div>
</div>

<style>
  [data-c="order-log"] { display: grid; gap: 1rem; width: min(100%, 34rem); }
  [data-c="order-log"] .order-log-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  [data-c="order-log"] .order-log-records { display: grid; min-height: 12.5rem; align-content: start; border-top: 1px solid var(--color-line); }
  [data-c="order-log"] .order-log-record {
    display: grid;
    grid-template-columns: 5.5rem 1fr;
    gap: 0.25rem 0.75rem;
    padding: 0.625rem 0;
    border-bottom: 1px solid var(--color-line);
    font-family: var(--font-mono);
    font-size: 0.75rem;
    animation: order-log-in 0.35s var(--ease-out);
  }
  [data-c="order-log"] .order-log-level { color: var(--color-accent); font-variant-numeric: tabular-nums; }
  [data-c="order-log"] .is-warn .order-log-level { color: var(--color-warning-300); }
  [data-c="order-log"] .is-error .order-log-level { color: var(--color-danger-300); }
  [data-c="order-log"] .order-log-body { color: var(--color-ink); }
  [data-c="order-log"] .order-log-attributes { grid-column: 2; overflow-wrap: anywhere; color: var(--color-faint); }
  [data-c="order-log"] .order-log-empty { padding: 0.75rem 0; color: var(--color-faint); font-size: 0.875rem; }
  [data-c="order-log"] .order-log-footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem; }
  [data-c="order-log"] .order-log-note { max-width: 24rem; color: var(--color-faint); font-size: 0.8125rem; }
  @keyframes order-log-in { from { opacity: 0; translate: 0 -0.25rem; } }
  @media (prefers-reduced-motion: reduce) {
    [data-c="order-log"] .order-log-record { animation: none; }
  }
</style>
