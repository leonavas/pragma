<script>
  import { log } from 'pragma'

  const severityNumbers = { debug: 5, info: 9, warn: 13, error: 17 }

  let records = []
  let orderNumber = 1041
  let nextRecordId = 1

  const orderId = () => 'A-' + orderNumber
  const recordRows = () => records.map(entry => ({
    ...entry,
    levelText: entry.level.toUpperCase() + ' ' + severityNumbers[entry.level],
    isInfo: entry.level === 'info',
    isWarn: entry.level === 'warn',
    isError: entry.level === 'error',
    attributesText: JSON.stringify(entry.attributes),
  }))

  function record(level, body, attributes) {
    log[level](body, attributes)
    records = [{ id: nextRecordId, level, body, attributes }, ...records].slice(0, 4)
    nextRecordId += 1
  }

  function placeOrder() {
    orderNumber += 1
    record('info', 'order placed', { 'order.id': orderId(), 'order.items': 3 })
  }

  function retryPayment() {
    record('warn', 'payment retried', { 'order.id': orderId(), 'payment.attempt': 2 })
  }

  function failPayment() {
    try {
      throw new Error('card declined')
    } catch (failure) {
      record('error', 'payment failed', { 'order.id': orderId(), 'exception.message': failure.message })
    }
  }

  function sendNow() {
    log.flush()
  }

  function mount() {
    log.debug('order panel mounted')
  }
</script>

<div class="grid w-full max-w-lg gap-4">
  <div class="flex flex-wrap gap-2" role="group" aria-label="Order events">
    <button type="button" class="btn btn-small" @click="placeOrder">Place order</button>
    <button type="button" class="btn btn-small" @click="retryPayment">Retry payment</button>
    <button type="button" class="btn btn-small" @click="failPayment">Fail payment</button>
  </div>
  <ol class="flex min-h-48 flex-col border-t border-line font-mono text-xs" aria-label="Last records passed to log">
    <for record in $recordRows key=record.id>
      <li class="record grid gap-x-3 gap-y-1 border-b border-line py-2.5">
        <span class="tabular-nums" .text-accent="record.isInfo" .text-warning-300="record.isWarn" .text-danger-300="record.isError">{record.levelText}</span>
        <span class="text-ink">{record.body}</span>
        <span class="record-attributes break-all text-faint">{record.attributesText}</span>
      </li>
    </for>
    <empty>
      <li class="py-3 font-sans text-sm text-faint">No records yet. Click a button.</li>
    </empty>
  </ol>
  <div class="flex flex-wrap items-center justify-between gap-3">
    <p class="max-w-sm text-sm text-faint">Queued, then posted to /_otel every 2 s or at 50 records, and with sendBeacon when the tab hides.</p>
    <button type="button" class="btn btn-small" @click="sendNow">Send now</button>
  </div>
</div>

<style>
  .record {
    grid-template-columns: 5.5rem 1fr;
    animation: record-in 0.35s var(--ease-out);
  }
  .record-attributes { grid-column: 2; }
  @keyframes record-in { from { opacity: 0; translate: 0 -0.25rem; } }
  @media (prefers-reduced-motion: reduce) {
    .record { animation: none; }
  }
</style>
