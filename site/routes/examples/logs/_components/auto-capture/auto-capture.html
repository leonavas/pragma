<script>
  let failures = []
  let nextFailureId = 1

  function remember(kind, message) {
    failures = [{ id: nextFailureId, kind, message }, ...failures].slice(0, 4)
    nextFailureId += 1
  }

  function throwNow() {
    throw new Error('inventory sync crashed')
  }

  async function rejectLater() {
    await new Promise(resolve => setTimeout(resolve, 150))
    throw new Error('price refresh timed out')
  }

  function mount() {
    const onError = event => remember('error', event.message)
    const onRejection = event => remember('unhandledrejection', event.reason?.message ?? String(event.reason))
    addEventListener('error', onError)
    addEventListener('unhandledrejection', onRejection)
    return () => {
      removeEventListener('error', onError)
      removeEventListener('unhandledrejection', onRejection)
    }
  }
</script>

<div>
  <div class="auto-capture-actions" role="group" aria-label="Failures">
    <button type="button" class="btn btn-small" @click="throwNow">Throw in an action</button>
    <button type="button" class="btn btn-small" @click="rejectLater">Reject in an async action</button>
  </div>
  <ol class="auto-capture-events" aria-label="Uncaught errors, each one logged by the runtime">
    <for failure in $failures key=failure.id>
      <li class="auto-capture-event">
        <span class="auto-capture-kind">{failure.kind}</span>
        <span class="auto-capture-message">{failure.message}</span>
      </li>
    </for>
    <empty>
      <li class="auto-capture-empty">No uncaught errors yet. Neither action has a try/catch or a log call.</li>
    </empty>
  </ol>
</div>
