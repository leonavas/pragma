<title>Refund</title>
<meta name="robots" content="noindex">

<script>
  import { data, call } from 'pragma'

  let result = ''

  async function send(action) {
    try {
      await call(action, { id: data.refund.id })
      result = action + ': done'
    } catch (failure) {
      result = action + ': ' + failure.message
    }
  }
</script>

<if page.loading>
  <p class="skeleton h-16"></p>
</if>
<else>
  <div>
    <h1>Refund {data.refund.id}</h1>
    <button class="btn" @click="send('approve')">
      Approve
    </button>
    <button class="btn" @click="send('escalate')">
      Escalate
    </button>
    <p role="status">{$result}</p>
  </div>
</else>
