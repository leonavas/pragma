<title>Refund</title>
<meta name="robots" content="noindex">

<script>
  import { data, call } from 'pragma'

  let result = ''

  async function send(action) {
    try {
      await call(action, { id: data.refund.id })
      result = action + ': done'
    } catch (failure) {
      result = action + ': ' + failure.message
    }
  }
</script>

<if page.loading>
  <p class="skeleton h-16 rounded-lg"></p>
</if>
<else>
  <div class="grid gap-3">
    <h1 class="font-mono text-xl">Refund {data.refund.id}</h1>
    <div class="flex gap-2">
      <button class="btn btn-primary" @click="send('approve')">
        Approve
      </button>
      <button class="btn btn-danger" @click="send('escalate')">
        Escalate
      </button>
    </div>
    <p class="font-mono text-sm text-muted" role="status">{$result}</p>
  </div>
</else>
