<script>
  let picked = ''

  const modes = () => [
    { value: 'chill', label: 'Chill' },
    { value: 'spicy', label: 'Spicy' },
    { value: 'chaos', label: 'Chaos' },
  ]

  function choose(event) {
    picked = new FormData(event.target).get('mode')
  }
</script>

<div class="grid gap-3">
  <form class="flex items-center gap-2"
    toolname="set_difficulty"
    tooldescription="Set the quest difficulty mode"
    @submit="choose">
    <c-select name="mode" label="Difficulty" value="chill"
      toolparamdescription="chill, spicy or chaos"
      :options="$modes"></c-select>
    <button class="btn btn-primary">Lock in</button>
  </form>
  <p class="font-mono text-xs text-muted">Selected: {$picked}</p>
</div>
