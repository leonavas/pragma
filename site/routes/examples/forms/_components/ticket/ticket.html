<script>
  let seats = 2
  let pass = 'day'
  let lunch = false
</script>

<div class="grid gap-2">
  <label>Seats
    <input type="number" min="1" max="9"
      class="w-16 border border-line px-2"
      :model="$seats">
  </label>
  <fieldset class="flex gap-4">
    <legend>Pass</legend>
    <label><input type="radio" name="pass" value="day"
      :model="$pass"> Day</label>
    <label><input type="radio" name="pass" value="week"
      :model="$pass"> Week</label>
  </fieldset>
  <label>
    <input type="checkbox" :model="$lunch"> Lunch
  </label>
  <p>{$seats} seats, {$pass} pass, lunch: {$lunch}</p>
</div>
