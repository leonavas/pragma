<script>
  import { data } from 'pragma'
  import { plainLines } from '../../../../../utils/code-lines.js'

  export let group = ''

  let selectedPath = ''
  let highlight = null

  function tokensOf(text, language) {
    const lines = highlight && language === 'html' ? highlight(text, language) : plainLines(text)
    return lines[0]?.tokens ?? []
  }

  const responses = () => data?.served?.[group] ?? []
  const active = () => responses().find(response => response.path === selectedPath) ?? responses()[0] ?? null
  const hasChoice = () => responses().length > 1
  const hasLines = () => lines().length > 0
  const statusText = () => (active() ? String(active().status || 'failed') : '')
  const card = () => active()?.card ?? null
  const codeLabel = () => 'Response from ' + (active()?.path ?? '')

  function tabs() {
    return responses().map(response => ({
      path: response.path,
      label: response.path.replace('/examples/seo/demo', ''),
      pressed: response === active() ? 'true' : 'false',
    }))
  }

  function lines() {
    const response = active()
    if (!response) return []
    return response.lines.map((line, index) => ({
      id: response.path + '-' + index,
      origin: line.origin,
      tokens: tokensOf(line.text, response.language),
    }))
  }

  function select(tab) {
    selectedPath = tab.path
  }

  function mount() {
    let mounted = true
    import('../../../../../utils/highlight.js').then(highlighter => {
      if (mounted) highlight = highlighter.highlightLines
    })
    return () => { mounted = false }
  }
</script>

<div>
  <if $hasChoice>
    <div class="response-tabs" role="group" aria-label="Requested address">
      <for tab in $tabs key=tab.path>
        <button type="button" class="response-tab" :aria-pressed="tab.pressed" @click="select(tab)">{tab.label}</button>
      </for>
    </div>
  </if>
  <if page.loading>
    <div class="response-skeleton" aria-busy="true" aria-label="Requesting the page">
      <span class="skeleton"></span>
      <span class="skeleton"></span>
      <span class="skeleton"></span>
    </div>
  </if>
  <else-if page.error>
    <p class="response-error" role="alert">{page.error.message}</p>
  </else-if>
  <else>
    <div class="response-body">
      <div>
        <div class="response-request">
          <p class="response-path"><span class="response-method">GET</span><span>{$active.path}</span></p>
          <p class="response-status" :data-tone="$active.tone"><span class="tabular-nums">{$statusText}</span><span class="response-type">{$active.type}</span></p>
        </div>
        <if $hasLines>
          <pre class="response-code" tabindex="0" :aria-label="$codeLabel"><code><for line in $lines key=line.id><span class="response-line" :data-origin="line.origin"><span class="response-origin" :data-origin="line.origin">{line.origin}</span><span class="response-text"><for token in line.tokens key=token.id><span :data-hl="token.kind">{token.text}</span></for></span></span></for></code></pre>
        </if>
      </div>
      <p class="response-note" :data-tone="$active.tone">{$active.note}</p>
      <if $card>
        <figure class="preview">
          <img class="preview-image" :src="$card.imagePath" :alt="$card.imageAlt" width="1200" height="630" loading="lazy">
          <figcaption class="preview-body">
            <span class="preview-host">{$card.host}</span>
            <strong class="preview-title">{$card.title}</strong>
            <span class="preview-description">{$card.description}</span>
          </figcaption>
        </figure>
      </if>
    </div>
  </else>
</div>

<style>
  [data-c="http-response"] { display: grid; gap: 1rem; width: 100%; min-width: 0; }
  [data-c="http-response"] .response-body { display: grid; gap: 1rem; min-width: 0; }

  [data-c="http-response"] .response-note:empty { display: none; }

  }
  [data-c="http-response"] .preview-image { display: block; width: 100%; height: auto; aspect-ratio: 1200 / 630; object-fit: cover; background: var(--color-raised); }

  [data-c="http-response"] .preview-host { color: var(--color-faint); font-family: var(--font-mono); font-size: 0.75rem; }
  [data-c="http-response"] :is(.preview-title, .preview-description) { display: -webkit-box; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }

  [data-c="http-response"] .preview-description { color: var(--color-muted); font-size: 0.8125rem; line-height: 1.45; }
  @media (prefers-reduced-motion: reduce) {
    [data-c="http-response"] .response-tab { transition: none; }
  }
</style>
