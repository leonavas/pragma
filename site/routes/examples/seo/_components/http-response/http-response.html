<script>
  import { data } from 'pragma'
  import { plainLines } from '../../../../../utils/code-lines.js'

  export let group = ''

  let selectedPath = ''
  let highlight = null

  function tokensOf(text, language) {
    const lines = highlight && language === 'html' ? highlight(text, language) : plainLines(text)
    return lines[0]?.tokens ?? []
  }

  const responses = () => data?.served?.[group] ?? []
  const active = () => responses().find(response => response.path === selectedPath) ?? responses()[0] ?? null
  const hasChoice = () => responses().length > 1
  const hasLines = () => lines().length > 0
  const statusText = () => (active() ? String(active().status || 'failed') : '')
  const card = () => active()?.card ?? null
  const codeLabel = () => 'Response from ' + (active()?.path ?? '')

  function tabs() {
    return responses().map(response => ({
      path: response.path,
      label: response.path.replace('/examples/seo/demo', ''),
      pressed: response === active() ? 'true' : 'false',
    }))
  }

  function lines() {
    const response = active()
    if (!response) return []
    return response.lines.map((line, index) => ({
      id: response.path + '-' + index,
      origin: line.origin,
      tokens: tokensOf(line.text, response.language),
    }))
  }

  function select(tab) {
    selectedPath = tab.path
  }

  function mount() {
    let mounted = true
    import('../../../../../utils/highlight.js').then(highlighter => {
      if (mounted) highlight = highlighter.highlightLines
    })
    return () => { mounted = false }
  }
</script>

<div class="grid w-full min-w-0 gap-4">
  <if $hasChoice>
    <div class="flex flex-wrap gap-1.5" role="group" aria-label="Requested address">
      <for tab in $tabs key=tab.path>
        <button type="button" class="response-tab cursor-pointer border bg-ground px-2.5 py-1.5 font-mono text-xs" :aria-pressed="tab.pressed" @click="select(tab)">{tab.label}</button>
      </for>
    </div>
  </if>
  <if page.loading>
    <div class="grid gap-2.5 border border-line bg-sunken px-3 py-4" aria-busy="true" aria-label="Requesting the page">
      <span class="skeleton h-2.5"></span>
      <span class="skeleton h-2.5 w-3/4"></span>
      <span class="skeleton h-2.5 w-1/2"></span>
    </div>
  </if>
  <else-if page.error>
    <p class="font-mono text-xs text-danger-300" role="alert">{page.error.message}</p>
  </else-if>
  <else>
    <div class="grid min-w-0 gap-4">
      <div>
        <div class="flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1 border border-b-0 border-line bg-surface px-3 py-2.5 font-mono text-xs">
          <p class="flex min-w-0 gap-2.5 break-all text-ink"><span class="flex-none text-faint">GET</span><span>{$active.path}</span></p>
          <p class="flex gap-2.5 font-semibold" :data-tone="$active.tone"><span class="tabular-nums">{$statusText}</span><span class="font-normal text-faint">{$active.type}</span></p>
        </div>
        <if $hasLines>
          <pre class="response-code" tabindex="0" :aria-label="$codeLabel"><code><for line in $lines key=line.id><span class="response-line" :data-origin="line.origin"><span class="response-origin" :data-origin="line.origin">{line.origin}</span><span class="response-text"><for token in line.tokens key=token.id><span :data-hl="token.kind">{token.text}</span></for></span></span></for></code></pre>
        </if>
      </div>
      <p class="response-note font-mono text-xs leading-relaxed" :data-tone="$active.tone">{$active.note}</p>
      <if $card>
        <figure class="grid overflow-hidden rounded-md border border-line-strong bg-surface shadow-lg">
          <img class="block h-auto w-full bg-raised object-cover" :src="$card.imagePath" :alt="$card.imageAlt" width="1200" height="630" loading="lazy">
          <figcaption class="grid min-w-0 gap-1 px-3.5 pt-3 pb-3.5">
            <span class="font-mono text-xs text-faint">{$card.host}</span>
            <strong class="line-clamp-2 text-sm font-semibold text-ink">{$card.title}</strong>
            <span class="line-clamp-2 text-sm text-muted">{$card.description}</span>
          </figcaption>
        </figure>
      </if>
    </div>
  </else>
</div>

<style>
  .response-tab { border-color: var(--color-line); color: var(--color-faint); }
  .response-tab:hover { color: var(--color-ink); }
  .response-tab[aria-pressed="true"] { border-color: var(--color-accent); color: var(--color-ink); }
  [data-tone="ok"] { color: var(--color-accent); }
  [data-tone="warn"] { color: var(--color-warning-300); }
  [data-tone="error"] { color: var(--color-danger-300); }
  .response-code {
    max-height: 22rem;
    padding: 0.625rem 0;
    overflow: auto;
    border: 1px solid var(--color-line);
    background: var(--color-sunken);
    font-size: 0.75rem;
    line-height: 1.7;
  }
  .response-line { display: flex; padding-inline: 0.75rem; }
  .response-origin { flex: none; width: 3.75rem; color: var(--color-faint); user-select: none; }
  .response-origin:empty, .response-note:empty { display: none; }
  .response-origin[data-origin="page"] { color: var(--color-accent); }
  [data-origin="layout"] .response-text { opacity: 0.62; }
  .response-text { min-width: 0; padding-left: 1.25em; text-indent: -1.25em; white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
