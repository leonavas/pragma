<title>{data.title} · Field notes</title>
<meta name="description"
  :content="data.article.summary">
<meta name="robots" :content="data.robots">
<link rel="canonical" :href="data.url">
<meta property="og:title"
  :content="data.article.title">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{data.article.title}",
  "datePublished": "{data.article.published}"
}
</script>

<if data.article>
  <article>
    <h1 class="text-2xl">{data.article.title}</h1>
    <p>{data.article.summary}</p>
  </article>
</if>
<else>
  <h1 class="text-2xl">Note not found</h1>
</else>
