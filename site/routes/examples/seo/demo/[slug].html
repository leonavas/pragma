<title>{data.head.title}</title>
<meta name="description" :content="data.head.description">
<meta name="robots" :content="data.head.robots">
<link rel="canonical" :href="data.head.url">
<meta property="og:type" content="article">
<meta property="og:url" :content="data.head.url">
<meta property="og:title" :content="data.article.title">
<meta property="og:description" :content="data.head.description">
<meta property="og:image" :content="data.head.image">
<meta property="og:image:alt" :content="data.head.imageAlt">
<meta property="article:published_time" :content="data.head.published">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{data.article.title}",
  "description": "{data.head.description}",
  "image": "{data.head.image}",
  "datePublished": "{data.head.published}",
  "mainEntityOfPage": "{data.head.url}",
  "publisher": { "@type": "Organization", "name": "pragma" }
}
</script>

<div class="wrap py-12 lg:py-16">
  <if data.article>
    <article class="prose">
      <h1 class="text-3xl font-medium tracking-tight text-ink">{data.article.title}</h1>
      <p class="font-mono text-xs text-faint"><time :datetime="data.article.published">{data.article.date}</time></p>
      <for paragraph in data.article.body key=paragraph.id>
        <p>{paragraph.text}</p>
      </for>
      <p><a href="/examples/seo/demo">All field notes</a></p>
    </article>
  </if>
  <else>
    <section class="prose">
      <h1 class="text-3xl font-medium tracking-tight text-ink">Note not found</h1>
      <p>No field note has this address. The status is still 200, so this page tells crawlers <code>noindex</code> instead.</p>
      <p><a href="/examples/seo/demo">All field notes</a></p>
    </section>
  </else>
</div>
