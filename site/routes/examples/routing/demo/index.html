<title>Posts · routing demo</title>
<meta name="robots" content="noindex">

<c-demo-page>
  <p-demo-nav></p-demo-nav>
  <h1 class="text-2xl font-medium tracking-tight">Posts</h1>
  <ul class="grid gap-2">
    <for post in $posts key=post.slug>
      <li><a class="text-ink underline" :href="post.href" :text="post.title"></a></li>
    </for>
  </ul>
  <ul class="grid gap-2 text-sm text-muted">
    <li><a class="underline" href="/examples/routing/demo/new">/demo/new</a> is new.html, not [slug]</li>
    <li><a class="underline" href="/examples/routing/demo/missing-post">/demo/missing-post</a> matches [slug], no post</li>
    <li><a class="underline" href="/examples/routing/demo/a/b">/demo/a/b</a> matches nothing: 404</li>
    <li><a class="underline" href="/examples/routing/demo" data-reload>Reload this page</a> with data-reload</li>
  </ul>
</c-demo-page>
