<title>Sort</title>
<meta name="robots" content="noindex">

<script>
  import { query } from 'pragma'

  const hottest = () => query.sort !== 'price' && 'true'
  const cheapest = () => query.sort === 'price' && 'true'
</script>

<nav class="flex gap-4 text-sm" aria-label="Sort">
  <a href="?sort=hot" :aria-current="$hottest">Hottest</a>
  <a href="?sort=price" :aria-current="$cheapest">Cheapest</a>
</nav>

<style>
  [aria-current] { font-weight: 700; color: var(--color-primary-500); }
</style>
