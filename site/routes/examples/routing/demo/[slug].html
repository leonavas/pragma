<title>Post · routing demo</title>
<meta name="robots" content="noindex">

<script>
  import { params } from 'pragma'
  import { posts } from './_posts.js'

  const post = () => posts.find(entry => entry.slug === params.slug) ?? null
</script>

<c-demo-page>
  <p-demo-nav></p-demo-nav>
  <if $post>
    <article class="grid gap-3">
      <h1 class="text-2xl font-medium tracking-tight">{$post.title}</h1>
      <p-post-meta :post="$post"></p-post-meta>
      <p class="text-muted">{$post.summary}</p>
    </article>
  </if>
  <else>
    <article class="grid gap-3">
      <h1 class="text-2xl font-medium tracking-tight">Post not found</h1>
      <p class="text-muted">No post has this slug. Not found is just data here, so the response is still 200.</p>
    </article>
  </else>
  <p class="text-sm text-faint">params.slug = <span class="font-mono text-ink">{params.slug}</span></p>
</c-demo-page>
