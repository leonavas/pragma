<script>
  import { data, call } from 'pragma'

  let name = ''
  let message = ''
  let sending = false
  let error = ''

  async function sign(event) {
    const fields = new FormData(event.target)
    const signing = call('sign', { name: fields.get('name'), message: fields.get('message') })
    if (event.agentInvoked) event.respondWith(signing)
    sending = true
    error = ''
    try {
      data.guestbook = (await signing).guestbook
      message = ''
    } catch (failure) {
      error = failure.message
    } finally {
      sending = false
    }
  }
</script>

<div class="grid w-full gap-5">
  <form class="grid gap-3" toolname="sign_guestbook" tooldescription="Sign the demo guestbook with a name and a short message" @submit="sign">
    <label class="guestbook-field">
      <span class="label">Name</span>
      <input class="guestbook-input" name="name" autocomplete="nickname" toolparamdescription="Name shown on the entry, 2 to 40 characters" :model="$name">
    </label>
    <label class="guestbook-field">
      <span class="label">Message</span>
      <input class="guestbook-input" name="message" toolparamdescription="Message of the entry, 3 to 140 characters" :model="$message">
    </label>
    <div class="flex items-center gap-3">
      <button class="btn btn-primary btn-small" :disabled="$sending">Sign</button>
      <p class="guestbook-error" role="status">{$error}</p>
    </div>
  </form>
  <if page.loading>
    <ul class="grid gap-2" aria-busy="true" aria-label="Loading entries">
      <li class="skeleton h-10"></li>
    </ul>
  </if>
  <else-if page.error>
    <p class="guestbook-error" role="alert">{page.error.message}</p>
  </else-if>
  <else>
    <ol class="grid gap-2" aria-label="Guestbook entries">
      <for entry in data.guestbook key=entry.id>
        <li class="guestbook-entry">
          <p class="guestbook-meta">{entry.name} <span class="text-faint">{entry.at}</span></p>
          <p class="text-sm">{entry.message}</p>
        </li>
      </for>
    </ol>
  </else>
</div>

<style>
  .guestbook-field {
    display: grid;
    gap: 0.375rem;
  }
  .guestbook-input {
    height: 2.5rem;
    padding: 0 0.75rem;
    border: 1px solid var(--color-line-strong);
    background: var(--color-sunken);
    color: var(--color-ink);
    font-size: 0.9375rem;
    caret-color: var(--color-accent);
  }
  .guestbook-input:focus-visible { outline-offset: 0; border-color: var(--color-accent); }
  .guestbook-error {
    color: var(--color-error);
    font-family: var(--font-mono);
    font-size: 0.75rem;
  }
  .guestbook-entry {
    display: grid;
    gap: 0.25rem;
    padding: 0.625rem 0.75rem;
    border: 1px solid var(--color-line);
    background: var(--color-ground);
  }
  .guestbook-meta {
    font-family: var(--font-mono);
    font-size: 0.6875rem;
    color: var(--color-accent-text);
  }
</style>
