<title>Time machine · data demo</title>
<meta name="robots" content="noindex">

<script>
  import { call } from 'pragma'

  let message = ''

  async function book(year) {
    try {
      message = (await call('book', { year })).message
    } catch (failure) {
      const taken = failure.status === 409
      message = taken ? failure.message : 'Try again.'
    }
  }
</script>

<div class="flex gap-2">
  <button class="btn" @click="book('1969')">Visit 1969</button>
  <button class="btn" @click="book('1999')">Visit 1999</button>
</div>
<p class="font-mono text-sm text-muted" role="status">{$message}</p>
