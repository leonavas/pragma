<title>{data.votes} votes · SSR demo</title>
<meta property="og:title" content="{data.votes} votes · SSR demo">
<meta name="robots" content="noindex">

<script>
  import { data, call, log } from 'pragma'

  let hydratedAt = ''
  let error = ''

  async function vote(option) {
    error = ''
    try {
      const result = await call('vote', { id: option.id })
      data.options = result.options
      data.votes = result.votes
    } catch (failure) {
      log.error('ssr demo vote failed', { 'exception.message': failure.message })
      error = failure.message
    }
  }

  function mount() {
    hydratedAt = new Date().toISOString().slice(11, 23)
  }
</script>

<c-demo-page>
  <dl class="grid grid-cols-2 gap-px border border-line bg-line font-mono text-xs">
    <div class="grid gap-1 bg-ground p-3">
      <dt class="text-faint">server rendered at</dt>
      <dd class="tabular-nums">{data.renderedAt}</dd>
    </div>
    <div class="grid gap-1 bg-ground p-3">
      <dt class="text-faint">client bound at</dt>
      <dd class="tabular-nums text-accent-text">{$hydratedAt}</dd>
    </div>
  </dl>
  <ul class="grid gap-2" aria-label="Rendering strategies">
    <for option in data.options key=option.id>
      <li class="flex items-center justify-between gap-4 border border-line px-4 py-3">
        <span class="text-sm">{option.label}</span>
        <button type="button" class="btn btn-small tabular-nums" aria-label="Vote for {option.label}" @click="vote(option)">{option.total}</button>
      </li>
    </for>
  </ul>
  <p class="font-mono text-xs text-error" role="status">{$error}</p>
  <p class="font-mono text-xs text-faint">first request by {data.agent}</p>
</c-demo-page>
