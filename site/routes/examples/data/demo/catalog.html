<title>Catalog demo · pragma examples</title>
<meta name="robots" content="noindex">

<c-demo-page>
  <nav class="flex flex-wrap gap-x-5 gap-y-2 font-mono text-xs" aria-label="Category">
    <a href="/examples/data/demo/catalog" class="nav-link" :aria-current="$filterLink.all">All</a>
    <a href="?category=hardware" class="nav-link" :aria-current="$filterLink.hardware">Hardware</a>
    <a href="?category=books" class="nav-link" :aria-current="$filterLink.books">Books</a>
    <a href="?fail=1" class="nav-link" :aria-current="$filterLink.broken">Make load throw</a>
  </nav>
  <if page.loading>
    <ul class="grid gap-2" aria-busy="true" aria-label="Loading products">
      <li class="skeleton h-12"></li>
      <li class="skeleton h-12"></li>
      <li class="skeleton h-12"></li>
    </ul>
  </if>
  <else-if page.error>
    <div class="grid gap-1 border border-danger-500/50 bg-danger-950/40 p-4" role="alert">
      <p class="font-mono text-sm text-danger-300" :text="page.error.message"></p>
      <p class="text-sm text-muted">HTTP 500 from /_data. The rest of the page still works: pick a category.</p>
    </div>
  </else-if>
  <else>
    <div class="grid gap-2">
      <ul class="grid gap-2">
        <for product in data.products key=product.id>
          <li class="flex items-center justify-between gap-4 border border-line px-4 py-3">
            <span class="text-sm" :text="product.name"></span>
            <span class="font-mono text-xs tabular-nums text-muted" :text="product.priceLabel"></span>
          </li>
        </for>
      </ul>
      <p class="font-mono text-xs text-faint">loaded at <span class="tabular-nums" :text="data.loadedAt"></span> UTC</p>
    </div>
  </else>
</c-demo-page>
