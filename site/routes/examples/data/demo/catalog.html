<title>Catalog · data demo</title>
<meta name="robots" content="noindex">

<if page.loading>
  <p class="skeleton h-12"></p>
</if>
<else-if page.error>
  <p role="alert">{page.error.message}</p>
</else-if>
<else>
  <ul>
    <for product in data.products key=product.id>
      <li>{product.name}</li>
    </for>
  </ul>
</else>
