<title>Oracle · data demo</title>
<meta name="robots" content="noindex">

<script>
  import { stream } from 'pragma'

  let fortune = ''

  async function ask() {
    fortune = ''
    for await (const chunk of stream('ask')) {
      fortune += chunk.word + ' '
    }
  }
</script>

<button class="btn btn-primary" @click="ask">Consult the oracle</button>
<p class="font-mono text-sm">{$fortune}</p>
