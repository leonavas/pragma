<script>
  let gear = [
    { id: 1, name: 'Spacesuit' },
    { id: 2, name: 'Duct tape' },
  ]

  function pack(event) {
    const form = new FormData(event.target)
    const id = gear.length + 1
    gear.push({ id, name: String(form.get('item')) })
    event.target.reset()
  }
</script>

<div class="grid w-full max-w-xs gap-3">
  <form class="flex gap-2" toolname="pack_item"
    tooldescription="Add an item to the Mars packing list"
    toolautosubmit @submit="pack">
    <input class="flex-1 rounded-lg border border-line bg-surface px-3 py-1.5 text-sm"
      name="item" aria-label="Gear item" required
      placeholder="Extra snacks…"
      toolparamdescription="Item to pack for Mars">
    <button class="btn btn-primary">Pack</button>
  </form>
  <ul class="grid gap-1.5">
    <for entry in $gear key=entry.id>
      <li class="rounded-lg border border-line bg-surface px-3 py-1.5 text-sm">
        {entry.name}
      </li>
    </for>
  </ul>
</div>
