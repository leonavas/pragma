<script>
  let message = ''
  let freeSeats = 6

  function book(guests) {
    if (guests < 1) return { error: 'At least 1 guest.' }
    if (guests > freeSeats) return { error: 'Full.' }
    freeSeats -= guests
    return { booked: guests, freeSeats }
  }

  function submit(event) {
    const form = new FormData(event.target)
    const result = book(Number(form.get('guests')))
    const reply = Promise.resolve(result)
    if (event.agentInvoked) event.respondWith(reply)
    const done = 'Booked. Free seats: ' + freeSeats
    message = result.error ?? done
  }
</script>

<div class="grid gap-2">
  <form class="flex gap-2" toolname="book_table"
    tooldescription="Book a table for a number of guests"
    toolautosubmit @submit="submit">
    <input class="border border-line px-2" name="guests"
      type="number" aria-label="Guests" required
      toolparamdescription="Number of guests, 1 or more">
    <button class="btn">Book</button>
  </form>
  <p>{$message}</p>
</div>
