<script>
  export let label = ''
  export let used = 0
  export let total = 100
  export let critical = false

  const percent = () => Math.round(used / total * 100)
  const types = () => `used: ${typeof used} · total: ${typeof total} · critical: ${critical}`
</script>

<figure .is-critical="$critical">
  <figcaption class="usage-head">
    <span>{$label}</span>
    <span class="tabular-nums">{$used} / {$total} · {$percent}%</span>
  </figcaption>
  <meter class="usage-meter" min="0" :max="$total" :value="$used" aria-label="{$label} usage"></meter>
  <p class="usage-types">{$types}</p>
</figure>

<style>
  [data-c="usage"] {
    display: grid;
    gap: 0.5rem;
    padding: 0.75rem 1rem;
    border: 1px solid var(--color-line);
    background: var(--color-surface);
    font-family: var(--font-mono);
    font-size: 0.75rem;
  }
  .usage-head { display: flex; justify-content: space-between; gap: 1rem; color: var(--color-ink); }
  .is-critical .usage-head { color: var(--color-error); }
  .usage-meter { width: 100%; height: 0.5rem; }
  .usage-types { color: var(--color-faint); }
</style>
