<script>
  const saveDelayMs = 900

  let draft = ''
  let saving = false
  let savedAt = ''
  let jobs = [
    { id: 'build', title: 'pragma build', done: true },
    { id: 'check', title: 'pragma check --strict', done: false },
  ]

  const pending = () => jobs.filter(job => !job.done).length
  const blank = () => !draft.trim()
  const saveText = () => saving ? 'Saving…' : 'Save'

  function add() {
    if (blank()) return
    jobs.push({ id: crypto.randomUUID(), title: draft.trim(), done: false })
    draft = ''
  }

  function toggle(job) {
    job.done = !job.done
  }

  function remove(job) {
    jobs = jobs.filter(entry => entry.id !== job.id)
  }

  async function save() {
    saving = true
    await new Promise(resolve => setTimeout(resolve, saveDelayMs))
    saving = false
    savedAt = new Date().toLocaleTimeString('en-GB')
  }
</script>

<div class="grid w-full max-w-sm gap-3">
  <form class="flex gap-2" @submit="add">
    <input class="queue-input" aria-label="New job" placeholder="New job" :model="$draft">
    <button class="btn btn-small" :disabled="$blank">Add</button>
  </form>
  <ul class="grid gap-1">
    <for job in $jobs key=job.id>
      <li class="queue-row" .is-done="job.done">
        <input type="checkbox" class="queue-check" :checked="job.done" aria-label="Done: {job.title}" @change="toggle(job)">
        <span class="queue-title">{job.title}</span>
        <button type="button" class="queue-remove" aria-label="Remove {job.title}" @click="remove(job)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" fill="none"></path></svg>
        </button>
      </li>
    </for>
    <empty>
      <li class="queue-empty">Queue is empty.</li>
    </empty>
  </ul>
  <div class="flex items-center justify-between gap-3">
    <p class="font-mono text-xs text-faint">{$pending} of {$jobs.length} pending</p>
    <button type="button" class="btn btn-small btn-primary" @click="save" :disabled="$saving">{$saveText}</button>
  </div>
  <p class="font-mono text-xs text-faint" role="status" :show="$savedAt">saved at {$savedAt}</p>
</div>
