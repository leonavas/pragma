<script>
  const tickMs = 31
  const pad = value => String(value).padStart(2, '0')

  let startedAt = 0
  let elapsedBefore = 0
  let now = 0
  let timer = 0
  let laps = []
  let lapCount = 0

  const running = () => timer !== 0
  const elapsed = () => elapsedBefore + (running() ? now - startedAt : 0)
  const untouched = () => !running() && elapsed() === 0
  const toggleText = () => running() ? 'Stop' : 'Start'
  const lapText = () => running() || untouched() ? 'Lap' : 'Reset'
  const display = () => {
    const centis = Math.floor(elapsed() / 10)
    const seconds = Math.floor(centis / 100)
    return `${pad(Math.floor(seconds / 60))}:${pad(seconds % 60)}.${pad(centis % 100)}`
  }

  function toggle() {
    if (running()) {
      clearInterval(timer)
      elapsedBefore = elapsed()
      timer = 0
      return
    }
    startedAt = performance.now()
    now = startedAt
    timer = setInterval(() => { now = performance.now() }, tickMs)
  }

  function lapOrReset() {
    if (running()) {
      lapCount += 1
      laps = [{ id: lapCount, time: display() }, ...laps].slice(0, 3)
      return
    }
    elapsedBefore = 0
    lapCount = 0
    laps = []
  }

  function mount() {
    return () => clearInterval(timer)
  }
</script>

<div class="grid w-full max-w-xs justify-items-center gap-4">
  <output class="stopwatch-display">{$display}</output>
  <div class="flex gap-2">
    <button type="button" class="btn btn-small" @click="lapOrReset" :disabled="$untouched">{$lapText}</button>
    <button type="button" class="btn btn-small btn-primary" @click="toggle">{$toggleText}</button>
  </div>
  <ol class="stopwatch-laps" aria-label="Laps">
    <for lap in $laps key=lap.id>
      <li class="flex justify-between gap-6"><span>{lap.id}</span><span>{lap.time}</span></li>
    </for>
  </ol>
</div>

<style>
  .stopwatch-display {
    font-family: var(--font-mono);
    font-size: 2.25rem;
    font-stretch: 85%;
    font-variant-numeric: tabular-nums;

  }
</style>
