<script>
  let time = ''

  function tick() {
    time = new Date().toLocaleTimeString('en-GB')
  }

  function mount() {
    tick()
    const timer = setInterval(tick, 1000)
    return () => clearInterval(timer)
  }
</script>

<div class="flex items-center gap-3 rounded-xl border border-line bg-surface px-5 py-3">
  <span class="size-2 rounded-full bg-primary-500"></span>
  <p class="font-mono text-2xl tabular-nums">{$time}</p>
</div>
