<script>
  const timeFormat = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' })

  let now = Date.now()
  let width = 0
  let resizes = 0

  const time = () => timeFormat.format(now)

  function mount() {
    width = window.innerWidth
    const timer = setInterval(() => { now = Date.now() }, 1000)
    const measure = () => {
      width = window.innerWidth
      resizes += 1
    }
    window.addEventListener('resize', measure)
    return () => {
      clearInterval(timer)
      window.removeEventListener('resize', measure)
    }
  }
</script>

<dl>
  <div class="clock-cell">
    <dt class="label">setInterval</dt>
    <dd class="clock-value">{$time}</dd>
  </div>
  <div class="clock-cell">
    <dt class="label">window resize</dt>
    <dd class="clock-value">{$width}px</dd>
  </div>
  <div class="clock-cell">
    <dt class="label">resize events</dt>
    <dd class="clock-value">{$resizes}</dd>
  </div>
</dl>
