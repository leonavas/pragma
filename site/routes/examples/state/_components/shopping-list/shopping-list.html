<script>
  const extras = ['Extra cheese', 'Jalapenos', 'Garlic butter', 'Truffle oil']
  let toppings = [{ id: 1, name: 'Tomato sauce' }]

  function add() {
    const name = extras[(toppings.length - 1) % extras.length]
    toppings.push({ id: toppings.length + 1, name })
  }
</script>

<div class="grid w-full max-w-xs justify-items-start gap-3">
  <button class="btn" @click="add">Add topping</button>
  <ul class="flex flex-wrap gap-2">
    <for topping in $toppings key=topping.id>
      <li class="rounded-full border border-line bg-surface px-3 py-1 text-sm">
        {topping.name}
      </li>
    </for>
  </ul>
</div>
