<script>
  import { frame } from 'pragma'

  let charge = 0

  const percent = () => Math.round(charge * 100)

  function step() {
    charge = Math.min(charge + 0.015, 1)
    if (charge < 1) frame(step)
  }

  function ignite() {
    charge = 0
    frame(step)
  }
</script>

<div class="grid w-full max-w-xs gap-3">
  <div class="flex items-center justify-between font-mono text-xs text-muted">
    <span>HYPERDRIVE</span>
    <span class="tabular-nums">{$percent}%</span>
  </div>
  <progress class="w-full" aria-label="Hyperdrive charge"
    :value="$charge"></progress>
  <button class="btn btn-primary" @click="ignite">Charge</button>
</div>
