<script>
  import { log } from 'pragma'

  const targets = [
    { id: 'alpha', name: 'alpha' },
    { id: 'beta', name: 'beta' },
  ]

  let reading = [{ id: 'hint', field: 'arguments', value: 'click a button or type a key' }]

  function inspect(target, event, el) {
    reading = [
      { id: 'target', field: 'target.name', value: target.name },
      { id: 'type', field: 'event.type', value: event.type },
      { id: 'clicked', field: 'event.target', value: '<' + event.target.localName + '>' },
      { id: 'el', field: 'el', value: '<' + el.localName + '>' },
    ]
  }

  function inspectKey(event) {
    reading = [
      { id: 'type', field: 'event.type', value: event.type },
      { id: 'key', field: 'event.key', value: event.key },
    ]
    log.debug('probe key', { 'key.name': event.key })
  }
</script>

<div class="grid w-full max-w-sm gap-4">
  <div class="flex flex-wrap gap-2">
    <for target in $targets key=target.id>
      <button type="button" class="btn btn-small" @click="inspect(target, event, el)">run <strong>{target.name}</strong></button>
    </for>
    <input class="probe-input" aria-label="Type a key" placeholder="type a key" @keydown="inspectKey">
  </div>
  <dl class="probe-reading">
    <for row in $reading key=row.id>
      <div class="probe-row">
        <dt>{row.field}</dt>
        <dd>{row.value}</dd>
      </div>
    </for>
  </dl>
</div>
