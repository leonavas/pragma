<script>
  import { debounce } from 'es-toolkit/function'

  let secret = ''
  let vaulted = ''

  const lockLater = debounce(() => {
    vaulted = secret
  }, 500)
</script>

<div class="grid w-full max-w-xs gap-3">
  <input class="rounded-lg border border-line bg-surface px-3 py-2 text-sm"
    aria-label="Top secret note" placeholder="Type a secret…"
    :model="$secret" @input="lockLater">
  <p class="rounded-lg border border-line bg-surface px-3 py-2 font-mono text-xs text-muted">
    Vaulted: {$vaulted}
  </p>
</div>
