<script>
  const money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' })

  let amount = 84.5
  let people = 3
  let tipPercent = '15'

  const bill = () => Math.max(amount ?? 0, 0)
  const headcount = () => Math.max(Math.round(people ?? 1), 1)
  const tip = () => bill() * Number(tipPercent) / 100
  const total = () => bill() + tip()
  const tipLabel = () => money.format(tip())
  const totalLabel = () => money.format(total())
  const perPersonLabel = () => money.format(total() / headcount())
</script>

<div class="grid w-full max-w-sm gap-4">
  <div class="grid grid-cols-3 gap-3">
    <label class="split-field">
      <span class="label">Bill</span>
      <input class="split-input" type="number" min="0" step="0.01" inputmode="decimal" :model="$amount">
    </label>
    <label class="split-field">
      <span class="label">People</span>
      <input class="split-input" type="number" min="1" step="1" inputmode="numeric" :model="$people">
    </label>
    <label class="split-field">
      <span class="label">Tip %</span>
      <select class="split-input" :model="$tipPercent">
        <option value="0">0</option>
        <option value="10">10</option>
        <option value="15">15</option>
        <option value="20">20</option>
      </select>
    </label>
  </div>
  <dl class="split-result">
    <dt>tip</dt><dd>{$tipLabel}</dd>
    <dt>total</dt><dd>{$totalLabel}</dd>
    <dt>each</dt><dd class="text-accent">{$perPersonLabel}</dd>
  </dl>
</div>
