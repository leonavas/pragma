<script>
  import { log } from 'pragma'

  const releaseDates = [
    { version: 'v0.3.0', date: '2026-11-02' },
    { version: 'v0.2.0', date: '2026-08-14' },
    { version: 'v0.1.0', date: '2025-12-01' },
  ]
  const statusByPhase = {
    idle: 'dayjs is not loaded yet.',
    loading: 'Fetching the chunk...',
    failed: 'Could not load dayjs.',
  }

  let phase = 'idle'
  let loadMs = 0
  let agoByVersion = {}

  const busy = () => phase === 'loading'
  const buttonText = () => (phase === 'ready' ? 'Recompute' : 'Load dayjs')
  const releases = () => releaseDates.map(release => ({ ...release, ago: agoByVersion[release.version] ?? '—' }))
  const status = () => (phase === 'ready' ? 'dayjs arrived in ' + loadMs + ' ms, after first paint.' : statusByPhase[phase])

  async function loadRelativeTimes() {
    const startedAt = performance.now()
    phase = 'loading'
    try {
      const [{ default: dayjs }, { default: relativeTime }] = await Promise.all([
        import('dayjs'),
        import('dayjs/plugin/relativeTime'),
      ])
      dayjs.extend(relativeTime)
      agoByVersion = Object.fromEntries(releaseDates.map(release => [release.version, dayjs(release.date).fromNow()]))
      loadMs = Math.round(performance.now() - startedAt)
      phase = 'ready'
    } catch (failure) {
      log.warn('dayjs import failed', { 'exception.message': failure.message })
      phase = 'failed'
    }
  }
</script>

<div class="grid w-full max-w-md gap-4 font-mono text-xs">
  <ul class="divide-y divide-line border-y border-line tabular-nums">
    <for release in $releases key=release.version>
      <li class="flex gap-3 py-2.5">
        <span class="w-16 text-ink">{release.version}</span>
        <span class="text-faint">{release.date}</span>
        <span class="ml-auto text-accent">{release.ago}</span>
      </li>
    </for>
  </ul>
  <div class="flex flex-wrap items-center gap-x-4 gap-y-3">
    <button type="button" class="btn btn-small" @click="loadRelativeTimes" :disabled="$busy">{$buttonText}</button>
    <p class="text-faint" role="status">{$status}</p>
  </div>
</div>
