<div class="w-full min-w-0 overflow-x-auto">
  <table class="w-full font-mono text-xs tabular-nums">
    <caption class="sr-only">{$label}</caption>
    <thead class="label border-b border-line-strong">
      <tr>
        <th scope="col" class="pb-2.5 text-left font-medium">Import</th>
        <th scope="col" class="size-raw pb-2.5 text-right font-medium">Raw</th>
        <th scope="col" class="w-20 pb-2.5 text-right font-medium">Gzip</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-line border-b border-line">
      <for row in $rows key=row.name>
        <tr .is-shipped="row.shipped">
          <th scope="row" class="pr-4 text-left font-normal">
            <span class="grid gap-1.5">
              <span class="text-ink">{row.name}</span>
              <span class="font-sans text-sm text-faint">{row.note}</span>
              <meter class="size-bar" min="0" max="1" :value="row.share" aria-hidden="true"></meter>
            </span>
          </th>
          <td class="size-raw w-20 text-right whitespace-nowrap text-muted">{row.rawText}</td>
          <td class="size-gzip w-20 text-right whitespace-nowrap">{row.gzipText}</td>
        </tr>
      </for>
    </tbody>
  </table>
</div>

<style>
  table { min-width: 18rem; }
  tbody :is(th, td) { padding-block: 0.875rem; vertical-align: top; }
  .size-bar { display: block; width: 100%; height: 0.375rem; margin-top: 0.25rem; appearance: none; background: var(--color-raised); }
  .size-bar::-webkit-meter-bar { height: 0.375rem; border: 0; border-radius: 0; background: var(--color-raised); }
  .size-bar::-webkit-meter-optimum-value { background: var(--color-line-strong); }
  .size-bar::-moz-meter-bar { background: var(--color-line-strong); }
  .is-shipped .size-bar::-webkit-meter-optimum-value { background: var(--color-accent); }
  .is-shipped .size-bar::-moz-meter-bar { background: var(--color-accent); }
  .is-shipped .size-gzip { color: var(--color-accent-text); }
  @media (max-width: 40rem) {
    .size-raw { display: none; }
  }
</style>
