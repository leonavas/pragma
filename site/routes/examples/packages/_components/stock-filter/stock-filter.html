<script>
  import { groupBy } from 'es-toolkit'
  import { debounce } from 'es-toolkit/function'

  const products = [
    { name: 'Roasted coffee', category: 'drinks' },
    { name: 'Green tea', category: 'drinks' },
    { name: 'Oat milk', category: 'drinks' },
    { name: 'Sourdough bread', category: 'bakery' },
    { name: 'Butter croissant', category: 'bakery' },
    { name: 'Brown sugar', category: 'pantry' },
    { name: 'Black tea leaves', category: 'pantry' },
  ]

  let term = ''
  let applied = ''
  let keystrokes = 0
  let runs = 0

  const applyLater = debounce(() => {
    applied = term.trim().toLowerCase()
    runs += 1
  }, 300)

  function groups() {
    const matching = products.filter(product => product.name.toLowerCase().includes(applied))
    return Object.entries(groupBy(matching, product => product.category))
      .map(([category, inCategory]) => ({ category, names: inCategory.map(product => product.name).join(', ') }))
  }

  function scheduleFilter() {
    keystrokes += 1
    applyLater()
  }

  function mount() {
    return () => applyLater.cancel()
  }
</script>

<div class="grid w-full max-w-md gap-3">
  <label class="grid gap-3 font-mono text-xs text-muted">
    Filter products
    <input type="search" class="h-9 border border-line-strong bg-surface px-3 text-sm text-ink" placeholder="tea, bread, oat..." autocomplete="off" :model="$term" @input="scheduleFilter">
  </label>
  <p class="flex justify-between font-mono text-xs tabular-nums text-faint"><span>{$keystrokes} keystrokes</span><span>{$runs} filter runs</span></p>
  <ul class="divide-y divide-line border-y border-line text-sm">
    <for group in $groups key=group.category>
      <li class="grid grid-cols-4 gap-4 py-2.5">
        <span class="font-mono text-xs leading-relaxed text-accent">{group.category}</span>
        <span class="col-span-3 text-ink">{group.names}</span>
      </li>
    </for>
    <empty>
      <li class="py-2.5 text-faint">No product matches.</li>
    </empty>
  </ul>
</div>
