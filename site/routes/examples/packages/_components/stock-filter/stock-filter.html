<script>
  import { groupBy } from 'es-toolkit'
  import { debounce } from 'es-toolkit/function'

  const products = [
    { name: 'Roasted coffee', category: 'drinks' },
    { name: 'Green tea', category: 'drinks' },
    { name: 'Oat milk', category: 'drinks' },
    { name: 'Sourdough bread', category: 'bakery' },
    { name: 'Butter croissant', category: 'bakery' },
    { name: 'Brown sugar', category: 'pantry' },
    { name: 'Black tea leaves', category: 'pantry' },
  ]

  let term = ''
  let applied = ''
  let keystrokes = 0
  let runs = 0

  const applyLater = debounce(() => {
    applied = term.trim().toLowerCase()
    runs += 1
  }, 300)

  function groups() {
    const matching = products.filter(product => product.name.toLowerCase().includes(applied))
    return Object.entries(groupBy(matching, product => product.category))
      .map(([category, inCategory]) => ({ category, names: inCategory.map(product => product.name).join(', ') }))
  }

  function scheduleFilter() {
    keystrokes += 1
    applyLater()
  }

  function mount() {
    return () => applyLater.cancel()
  }
</script>

<div>
  <label for="stock-term" class="stock-filter-label">Filter products</label>
  <input id="stock-term" type="search" class="stock-filter-input" placeholder="tea, bread, oat..." autocomplete="off" :model="$term" @input="scheduleFilter">
  <p class="stock-filter-counts"><span>{$keystrokes} keystrokes</span><span>{$runs} filter runs</span></p>
  <ul class="stock-filter-groups">
    <for group in $groups key=group.category>
      <li class="stock-filter-group">
        <span class="stock-filter-category">{group.category}</span>
        <span class="stock-filter-names">{group.names}</span>
      </li>
    </for>
    <empty>
      <li class="stock-filter-empty">No product matches.</li>
    </empty>
  </ul>
</div>
