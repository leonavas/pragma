<script>
  import { email, maxLength, nonEmpty, object, pipe, safeParse, string, trim } from 'valibot'

  const signup = object({
    email: pipe(string(), trim(), nonEmpty('Type an email.'), email('That is not an email address.'), maxLength(64, 'Keep it under 64 characters.')),
  })

  let address = 'ana@example'
  let joined = ''

  const validation = () => safeParse(signup, { email: address })
  const valid = () => validation().success
  const invalid = () => !valid()
  const ariaInvalid = () => (valid() ? 'false' : 'true')

  function status() {
    const result = validation()
    if (!result.success) return result.issues[0].message
    return joined === result.output.email ? 'Joined as ' + joined : 'Looks good.'
  }

  function submit() {
    const result = validation()
    if (result.success) joined = result.output.email
  }
</script>

<form class="grid w-full max-w-sm gap-2.5 font-mono text-xs" notool @submit="submit" novalidate>
  <label for="signup-email" class="text-muted">Work email</label>
  <div class="flex gap-2">
    <input id="signup-email" type="email" class="h-8 min-w-0 flex-1 border bg-surface px-3 text-sm text-ink" autocomplete="off" spellcheck="false" :model="$address" :aria-invalid="$ariaInvalid" aria-describedby="signup-email-status">
    <button type="submit" class="btn btn-small" :disabled="$invalid">Join</button>
  </div>
  <p id="signup-email-status" class="min-h-5" role="status" .text-accent="$valid" .text-warning-300="$invalid">{$status}</p>
</form>

<style>
  input { border-color: var(--color-line-strong); }
  input[aria-invalid="true"] { border-color: var(--color-warning-500); }
</style>
