<div role="group" :aria-label="$label">
  <span class="counter-label" :text="$label"></span>
  <div class="counter-controls">
    <button type="button" class="counter-step" aria-label="Decrease" @click="decrease" :disabled="$atMinimum">−</button>
    <output class="counter-value" :text="$count"></output>
    <button type="button" class="counter-step" aria-label="Increase" @click="increase">+</button>
  </div>
  <button type="button" class="counter-reset" @click="reset" :disabled="$atStart">Reset</button>
</div>
