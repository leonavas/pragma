<dl>
  <dt class="probe-call" :text="$call"></dt>
  <dd class="probe-row">
    <span>HTML <code>$locked</code></span>
    <if $locked><strong class="probe-yes">truthy</strong></if>

  <dd class="probe-row">
    <span>JS <code>ctx.$.locked</code></span>

  </dd>
</dl>
