<script>
  export let call = ''
  export let step = 1
  export let locked = false
  export let label = 'none'

  const describe = value => JSON.stringify(value) + ' · ' + typeof value
  const stepValue = () => describe(step)
  const lockedValue = () => describe(locked)
  const labelValue = () => describe(label)
</script>

<dl>
  <dt class="probe-call">{$call}</dt>
  <dd class="probe-row"><code>step = 1</code><strong>{$stepValue}</strong></dd>
  <dd class="probe-row"><code>locked = false</code><strong .probe-yes="$locked">{$lockedValue}</strong></dd>
  <dd class="probe-row"><code>label = 'none'</code><strong>{$labelValue}</strong></dd>
</dl>
