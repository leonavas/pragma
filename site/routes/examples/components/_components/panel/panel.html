<script>
  export let heading = ''

  let collapsed = false

  const expanded = () => String(!collapsed)
  const toggleText = () => (collapsed ? 'Show' : 'Hide')

  function toggle() {
    collapsed = !collapsed
  }
</script>

<section aria-label="{$heading}">
  <header class="panel-head">
    <h3 class="panel-heading">{$heading}</h3>
    <button type="button" class="panel-toggle" @click="toggle" :aria-expanded="$expanded">{$toggleText}</button>
  </header>
  <div class="panel-body" :hidden="$collapsed">
    <slot><p class="panel-empty">Nothing here yet.</p></slot>
  </div>
  <footer class="panel-actions"><slot name="actions"></slot></footer>
</section>
