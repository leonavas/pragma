<script>
  import { open, close, confirm } from 'pragma'

  let name = 'minimart'
  let draft = ''

  const invalid = () => !draft.trim()

  function edit() {
    draft = name
    open('rename-modal')
  }

  function save() {
    name = draft.trim()
    close('rename-modal')
  }

  async function discard() {
    if (draft !== name && await confirm('discard-alert') !== 'ok') return
    close('rename-modal')
  }
</script>

<div>
  <p class="rename-current">Project: <strong>{$name}</strong></p>
  <button type="button" class="btn" @click="edit">Rename project</button>
  <c-modal id="rename-modal" title="Rename project">
    <label class="rename-field">
      <span>Name</span>
      <input type="text" autocomplete="off" :model="$draft">
    </label>
    <button slot="actions" type="button" class="btn" @click="discard">Discard</button>
    <button slot="actions" type="button" class="btn btn-primary" @click="save" :disabled="$invalid">Save</button>
  </c-modal>
  <c-alert id="discard-alert" title="Discard your changes?">
    <p>The new name has not been saved.</p>
    <button slot="actions" type="button" class="btn" @close value="cancel" autofocus>Keep editing</button>
    <button slot="actions" type="button" class="btn btn-danger" @close value="ok">Discard</button>
  </c-alert>
</div>
