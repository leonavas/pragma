<div :data-status="$status">
  <p class="status-line">
    <span class="status-dot" aria-hidden="true"></span>
    <span class="font-mono text-sm text-muted" .text-accent="$passed" .text-danger-300="$failed" :text="$status"></span>
  </p>
  <div class="flex flex-wrap gap-2">
    <button type="button" class="btn btn-small" @click="run" :disabled="$running">Run build</button>
    <button type="button" class="btn btn-small" @click="breakIt" :disabled="$running">Run with an error</button>
  </div>
</div>
