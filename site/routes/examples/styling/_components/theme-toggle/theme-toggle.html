<script>
  import { theme, setTheme } from '../../../../../.pragma/theme.js'

  let dark = theme() === 'dark'

  const label = () => (dark ? 'Switch to daylight' : 'Switch to night shift')

  function toggle() {
    dark = !dark
    setTheme(dark ? 'dark' : 'light')
  }
</script>

<div class="grid gap-3 rounded-xl border border-neutral-200 bg-white p-4 text-neutral-900 dark:border-neutral-800 dark:bg-neutral-900 dark:text-neutral-100">
  <p class="text-sm">Your eyes will thank you at 2 AM.</p>
  <button class="btn" @click="toggle">{$label}</button>
</div>
