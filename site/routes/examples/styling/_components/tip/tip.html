<script>
  let open = false

  function crack() {
    open = !open
  }
</script>

<div class="grid w-full max-w-xs justify-items-center gap-3">
  <button class="btn" @click="crack">Crack fortune cookie</button>
  <if $open>
    <p class="fortune rounded-xl border border-line bg-surface px-4 py-3 text-center text-sm italic">
      Your next build will pass on the first try.
    </p>
  </if>
</div>

<style>
  .fortune[data-entering] { animation: pop-in 0.2s ease-out; }
  .fortune[data-leaving] { animation: pop-out 0.15s ease-in; }
  @keyframes pop-in { from { opacity: 0; translate: 0 6px; scale: 0.96; } }
  @keyframes pop-out { to { opacity: 0; translate: 0 -4px; } }
</style>
