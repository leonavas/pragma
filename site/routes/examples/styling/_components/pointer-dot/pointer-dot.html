<script>
  import { frame } from 'pragma'

  let pointerX = 96
  let cancel = null

  function move(event, track) {
    cancel ??= frame(() => {
      cancel = null
      const box = track.getBoundingClientRect()
      pointerX = event.clientX - box.left
    })
  }
</script>

<div class="relative h-14 w-full overflow-hidden rounded-xl border border-line bg-surface"
  @pointermove="move(event, el)">
  <div class="orb size-10 rounded-full bg-primary-500 shadow-lg"
    :--x="$pointerX"></div>
</div>

<style>
  .orb {
    margin-top: 0.5rem;
    translate: calc(var(--x) * 1px - 50%) 0;
  }
</style>
