<div :data-theme="$mode">
  <div class="preview-bar">
    <span class="preview-mode" :text="$modeText"></span>
    <button type="button" class="preview-toggle" @click="toggle" :aria-pressed="$pressed">Dark theme</button>
  </div>
  <article class="rounded-lg border border-neutral-200 bg-white p-4 shadow-md dark:border-neutral-800 dark:bg-neutral-900">
    <h3 class="text-sm font-semibold text-neutral-900 dark:text-neutral-100">Invoice 2041</h3>
    <p class="mt-1 text-sm text-neutral-600 dark:text-neutral-400">Due in 3 days, 48.00 EUR</p>
    <span class="mt-3 inline-block rounded-full bg-success-100 px-2 py-0.5 text-xs text-success-800 dark:bg-success-900 dark:text-success-200">Paid</span>
  </article>
</div>
