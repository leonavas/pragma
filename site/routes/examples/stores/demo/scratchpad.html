<title>Scratchpad, second page · pragma examples</title>
<meta name="robots" content="noindex">

<c-demo-page>
  <p class="flex items-center justify-between gap-3 font-mono text-xs text-faint">
    <span>Second page, same store</span>
    <span class="text-accent" :show="shared.scratchpad.pinned">pinned</span>
  </p>
  <textarea class="w-full border border-line-strong bg-sunken px-3 py-2.5 text-base" rows="4" maxlength="280" aria-label="Draft on the second page" :model="shared.scratchpad.draft"></textarea>
  <p class="font-mono text-xs text-faint tabular-nums" :text="shared.scratchpad.characters"></p>
</c-demo-page>
