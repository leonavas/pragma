<section aria-label="Scratchpad on this page">
  <header class="store-panel-head">
    <span class="label">this page</span>
    <span class="font-mono text-xs text-accent" :show="shared.scratchpad.pinned">pinned</span>
  </header>
  <div class="grid gap-3 p-3">
    <textarea class="store-textarea" rows="4" maxlength="280" aria-label="Draft" placeholder="Type here, then reload the page" :model="shared.scratchpad.draft"></textarea>
    <div class="flex items-center justify-between gap-3">
      <span class="font-mono text-xs text-faint tabular-nums" :text="shared.scratchpad.characters"></span>
      <span class="flex gap-2">
        <button type="button" class="btn btn-small" @click="togglePin" :text="shared.scratchpad.pinText"></button>
        <button type="button" class="btn btn-small" @click="wipe">Wipe</button>
      </span>
    </div>
  </div>
</section>
