<title>Page not found · pragma</title>
<meta name="robots" content="noindex">

<script>
  const requestedPath = () => decodeURI(location.pathname)
</script>

<div class="wrap grid gap-10 pt-16 lg:grid-cols-2 lg:items-center lg:gap-16 lg:pt-28">
  <div>
    <h1 class="text-3xl sm:text-5xl">Page not found</h1>
    <p class="mt-6 max-w-md text-lg leading-relaxed text-muted">Every page of this site is a file in routes/. No file matches this address, so the server answered with routes/_404.html and status 404.</p>
    <div class="mt-8 grid gap-3 sm:flex sm:flex-wrap">
      <a href="/" class="btn btn-primary">Back to home</a>
      <a href="/examples" class="btn">Browse the examples</a>
    </div>
  </div>
  <c-terminal title="pragma serve">
    <pre tabindex="0" aria-label="The request and the 404 answer"><code><span class="term-cmd">GET {$requestedPath}</span>
<span class="term-err">404</span> no route matches <span class="term-ink">{$requestedPath}</span>
<span class="term-dim">served routes/_404.html</span></code></pre>
  </c-terminal>
</div>
